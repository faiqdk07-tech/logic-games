<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nalar Harian</title>
<meta name="theme-color" content="#dcecff">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ef5f5a;--yellow:#ffd24f;--blue:#4b8ae8;--green:#3fb46e;--orange:#ff9d4d;--sky:#4fc0ec;--pink:#f47eab;--lime:#a2d058;--gray:#d3dcea;
  --ink:#28324d;--line:#5b6d99;--sh:rgba(52,78,150,.22);--plate:#ffffff;--text:#26304b;--muted:#64708e;--faint:#a3aec6;--edge:#e1e8f4;
  --accent:var(--blue);--accent-soft:#e2ecfc;--ok:var(--green);--ok-soft:#e2f2e8;--bad:var(--red);--bad-soft:#fbe7e6;--warn:var(--orange);
  --base:#e6eefa;--stud-hi:#f5f8fe;--stud-lo:#d3e0f3;
}
@media (prefers-color-scheme:dark) and (max-width:0px){:root{
  --ink:#262a33;--line:#58637c;--sh:rgba(0,0,0,.25);--plate:#283146;--text:#e4e7ee;--muted:#a1a9ba;--faint:#6e778b;--edge:#384360;--gray:#4d576c;
  --red:#c9655f;--yellow:#d7b85f;--blue:#5a82c4;--green:#4f9c70;--orange:#cf9058;--sky:#64a9c7;--pink:#c9829f;--lime:#93b266;
  --accent-soft:#1f3256;--ok-soft:#173a28;--bad-soft:#45201f;
  --base:#1c2332;--stud-hi:#222b3c;--stud-lo:#171e2b;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14.5px/1.5 "Rubik",-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-color:var(--base);
  background-image:radial-gradient(circle at 11px 10px,var(--stud-hi) 0 4.5px,transparent 5px),radial-gradient(circle at 12px 12px,var(--stud-lo) 0 6px,transparent 6.5px);
  background-size:24px 24px;background-attachment:fixed;
  padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 104px)}
.bg{display:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
.disp{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;letter-spacing:.2px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* plate = kartu dasar */
.glass{position:relative;background:var(--plate);border:2px solid var(--line);border-radius:12px;box-shadow:0 5px 0 var(--sh)}
.card{padding:14px 15px;margin-bottom:18px}
.st{position:absolute;top:-11px;left:14px;display:flex;gap:9px;pointer-events:none}
.st.r{left:auto;right:14px}
.st i{display:block;width:20px;height:9px;background:var(--c,var(--plate));border:2px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0}
.has-st{margin-top:12px}

.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 16px}
.logo{display:flex;align-items:center;gap:9px}
.logo svg{width:34px;height:34px;flex:none}
.ttl{font-family:"Lilita One","Rubik",sans-serif;font-size:26px;line-height:1;letter-spacing:.3px}
.sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.top-r{display:flex;gap:8px;align-items:center}
.ibtn{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;background:var(--blue);color:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--sh)}
.ibtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--sh)}
.ibtn svg{width:19px;height:19px}

h2{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:20px;line-height:1.2;margin-bottom:6px}
h3{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:17px;margin:20px 2px 12px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.wrapf{flex-wrap:wrap}

.lbl{display:inline-block;font-family:"Lilita One","Rubik",sans-serif;font-size:13.5px;line-height:1.2;color:var(--ink);background:var(--lc,var(--yellow));
  border:2px solid var(--line);border-radius:6px;padding:2px 8px 3px;transform:rotate(-2deg);box-shadow:2px 2px 0 var(--sh);margin-bottom:9px}
.lbl.w{color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--plate);border:2px solid var(--line);color:var(--text);white-space:nowrap}
.chip.a{background:var(--blue);color:#fff}.chip.ok{background:var(--green);color:#fff}.chip.bad{background:var(--red);color:#fff}.chip.y{background:var(--yellow);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 15px;border-radius:9px;font-size:14.5px;font-weight:600;
  background:var(--plate);border:2px solid var(--line);box-shadow:0 3px 0 var(--sh);transition:transform .05s,box-shadow .05s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--sh)}
.btn.p{background:var(--yellow);color:#2f333d;font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:16px;letter-spacing:.3px}
.btn.w{width:100%}
.btn:disabled{opacity:.45}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px;border-radius:7px;border-width:2px;box-shadow:0 2px 0 var(--sh)}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.opt{text-align:left;padding:10px 12px;border-radius:10px;background:var(--plate);border:2px solid var(--line);box-shadow:0 3px 0 var(--sh);font-size:14.5px;line-height:1.4;display:flex;gap:10px;align-items:flex-start;transition:transform .05s,box-shadow .05s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--sh)}
.opt .k{flex:none;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-family:"Lilita One","Rubik",sans-serif;font-size:13px;background:var(--c,var(--blue));color:#fff;border:2px solid var(--line);margin-top:-1px}
.opt.ok{background:var(--green);color:#fff}.opt.ok .k{background:#fff;color:var(--green)}
.opt.bad{background:var(--red);color:#fff;animation:shake .3s}.opt.bad .k{background:#fff;color:var(--red)}
.opt.ok{animation:snap .3s cubic-bezier(.3,1.7,.5,1)}
.opt.dim{opacity:.45}
.opt.sel{background:var(--accent-soft)}
@keyframes snap{0%{transform:translateY(-4px)}60%{transform:translateY(2px)}100%{transform:none}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.stim{font-size:15px;line-height:1.55;white-space:pre-line}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.45;background:var(--base);border:2px dashed var(--line)}
.fb b{font-weight:700}
.bar{height:12px;border-radius:6px;background:var(--plate);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--yellow);transition:width .4s linear}
.steps{display:flex;gap:6px;margin:4px 0 10px}
.steps i{flex:1;height:12px;border-radius:3px;background:var(--plate);border:2px solid var(--line)}
.steps i.on{background:var(--yellow)}.steps i.done{background:var(--green)}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:2px dashed var(--edge)}
.list .it:first-child{border-top:0}
.sent{padding:8px 10px;border-radius:9px;background:var(--base);border:2px solid var(--line);margin-top:8px}
.sent .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:var(--line);color:#fff;font-size:11px;font-weight:700;margin-right:6px;vertical-align:1px}
.roles{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.role{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;border:2px solid var(--line);background:var(--plate);box-shadow:0 2px 0 var(--sh)}
.role:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.role.sel{background:var(--blue);color:#fff}.role.ok{background:var(--green);color:#fff}.role.bad{background:var(--red);color:#fff}
textarea,input[type=date],select{width:100%;border-radius:9px;border:2px solid var(--line);background:var(--plate);padding:9px 11px;font-size:14px;outline:none}
textarea{min-height:90px;resize:vertical;line-height:1.45}
textarea:focus,input:focus,select:focus{box-shadow:0 0 0 3px var(--yellow)}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.t th,table.t td{padding:5px 7px;border-bottom:2px dashed var(--edge);text-align:left}
table.t th{font-weight:700}

/* tab bar: deretan balok */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:6px;padding:14px 8px 8px;border-radius:14px;z-index:20;width:min(430px,calc(100% - 20px));
  background:#3a4f86;border:2px solid #2e3f6e;box-shadow:0 5px 0 var(--sh)}
.tabs button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:7px;font-family:"Lilita One","Rubik",sans-serif;font-size:11.5px;letter-spacing:.3px;
  color:#fff;background:var(--c);border:2px solid var(--line);box-shadow:0 2px 0 var(--sh);transform:translateY(3px);transition:transform .15s,box-shadow .15s;filter:saturate(.92);opacity:.9}
.tabs button svg{width:19px;height:19px}
.tabs button::before,.tabs button::after{content:'';position:absolute;top:-8px;width:14px;height:6px;background:var(--c);border:2px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;opacity:0;transition:opacity .15s}
.tabs button::before{left:18%}.tabs button::after{right:18%}
.tabs button.on{transform:translateY(-3px);box-shadow:0 5px 0 rgba(0,0,0,.22);filter:none;opacity:1}
.tabs button.on::before,.tabs button.on::after{opacity:1}
.tabs button.yk{color:var(--ink)}

/* balok kecil & menara */
.tower{display:flex;flex-wrap:wrap-reverse;gap:7px 3px;padding:12px 10px 8px;min-height:64px;border-radius:9px;border:2px solid var(--line);align-content:flex-start;
  background-color:color-mix(in srgb,var(--green) 55%,var(--plate));background-image:radial-gradient(circle at 7px 7px,rgba(255,255,255,.32) 0 3.5px,transparent 4px);background-size:14px 14px}
.b{position:relative;width:30px;height:14px;background:var(--c);border:2px solid var(--line);border-radius:3px;flex:none}
.b::before,.b::after{content:'';position:absolute;top:-6px;width:7px;height:4px;background:var(--c);border:2px solid var(--line);border-bottom:0;border-radius:3px 3px 0 0}
.b::before{left:4px}.b::after{right:4px}
.b.x{--c:var(--gray)}
.b.new{animation:drop .45s cubic-bezier(.3,1.6,.55,1)}
@keyframes drop{0%{transform:translateY(-40px);opacity:0}100%{transform:none;opacity:1}}
.mtower{display:flex;flex-wrap:wrap;gap:6px 3px;padding-top:6px;min-height:22px}
.mtower .b{width:20px;height:10px}.mtower .b::before,.mtower .b::after{width:5px;height:3px;top:-5px}
.mtower .b::before{left:2px}.mtower .b::after{right:2px}

.part{display:flex;gap:11px;align-items:center;padding:9px 0;border-top:2px dashed var(--edge)}
.part:first-child{border-top:0}
.part .pn{flex:none;width:36px;height:30px;border-radius:6px;background:var(--c);border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-family:"Lilita One","Rubik",sans-serif;font-size:16px;box-shadow:0 2px 0 var(--sh);position:relative}
.part .pn.yk{color:var(--ink)}
.part.done .pn{opacity:.55}
.part.cur .pn{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px;margin-top:14px}
.tile{position:relative;text-align:left;padding:13px;display:flex;flex-direction:column;gap:6px;min-height:142px;background:var(--c);color:#fff;border:2px solid var(--line);border-radius:12px;box-shadow:0 5px 0 var(--sh);transition:transform .06s,box-shadow .06s}
.tile:active{transform:translateY(5px);box-shadow:0 0 0 var(--sh)}
.tile.yk{color:var(--ink)}
.tile .ic{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;background:var(--plate);color:var(--text);border:2px solid var(--line)}
.tile .ic svg{width:18px;height:18px}
.tile b{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:17px;line-height:1.1}
.tile .tiny{opacity:.92}
.tile .best{margin-top:auto;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.10);padding:2px 7px;border-radius:5px;align-self:flex-start}

.pips{display:flex;gap:4px;margin-top:8px}
.pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--plate)}
.pip.on{background:var(--c)}.pip.off{background:var(--gray)}.pip.none{border:2px dashed var(--faint);background:transparent}
.tahap{display:flex;flex-direction:column-reverse;gap:2px}
.tahap i{width:26px;height:8px;border-radius:2px;border:2px solid var(--line);background:var(--plate)}
.tahap i.on{background:var(--c)}
.skb{flex:none;width:38px;height:34px;border-radius:6px;background:var(--c);border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-family:"Lilita One","Rubik",sans-serif;font-size:15px;box-shadow:0 2px 0 var(--sh)}
.skb.yk{color:var(--ink)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-40px);opacity:0;transition:.25s cubic-bezier(.3,1.5,.5,1);z-index:50;padding:8px 14px;font-family:"Lilita One","Rubik",sans-serif;font-size:15px;
  border-radius:9px;pointer-events:none;background:var(--yellow);color:#2f333d;border:2px solid var(--line);box-shadow:0 4px 0 var(--sh)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet .pane{width:min(560px,100%);max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:none;border-bottom:0}
.swipe{position:relative;height:220px;margin:14px 0 18px;touch-action:pan-y}
.scard{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;justify-content:center;font-size:16.5px;line-height:1.45;transition:transform .25s,opacity .25s;user-select:none;-webkit-user-select:none}
.scard .base{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.wcards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.wc{aspect-ratio:3/4;border-radius:10px;display:grid;place-items:center;text-align:center;padding:6px;font-size:13px;font-weight:700;background:var(--plate);border:2px solid var(--line);box-shadow:0 4px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.wc.sel{background:var(--blue);color:#fff;transform:translateY(4px) rotate(-3deg);box-shadow:0 0 0 var(--sh)}
.wc.ok{background:var(--green);color:#fff}.wc.bad{background:var(--red);color:#fff}.wc.miss{background:var(--orange);color:#fff;border-style:dashed}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{max-width:86%;padding:7px 11px;border-radius:12px 12px 12px 3px;font-size:14px;line-height:1.4;background:var(--plate);border:2px solid var(--line);box-shadow:0 2px 0 var(--sh);text-align:left}
.msg .who{font-size:11px;font-weight:700;color:var(--blue);display:block}
.msg.r{align-self:flex-end;border-radius:12px 12px 3px 12px;background:#fdf3d4;color:#2f333d}
.msg.ok{background:var(--green);color:#fff}.msg.bad{background:var(--red);color:#fff}.msg.ok .who,.msg.bad .who{color:#fff}
.promos{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.promo{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;background:var(--plate);border:2px solid var(--line);box-shadow:0 3px 0 var(--sh);font-weight:700;font-size:14.5px;text-align:left}
.promo:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.promo.ok{background:var(--green);color:#fff}.promo.bad{background:var(--red);color:#fff}
.venn{width:100%;max-width:300px;display:block;margin:6px auto 0}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px}
.cap{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.intro{background:var(--plate);border:2px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.grid2 .tile:last-child:nth-child(odd){grid-column:span 2;min-height:110px}
.big{font-family:"Lilita One","Rubik",sans-serif;font-size:46px;line-height:1}
a{color:var(--blue)}
details summary{cursor:pointer;font-size:13px;font-weight:600;margin-top:10px}
pre.pv{white-space:pre-wrap;font-size:11.5px;line-height:1.4;max-height:220px;overflow:auto;margin-top:6px;padding:8px;border-radius:9px;background:var(--base);border:2px solid var(--line)}
.days{display:flex;gap:6px;margin-top:6px}
.days>div{flex:1;text-align:center}
.days .b{width:100%;height:18px;margin-top:6px}
.days .b::before{left:20%}.days .b::after{right:20%}

/* tepi berwarna: balok memakai bayangan dari warnanya sendiri */
.b,.b::before,.b::after,.tile,.part .pn,.skb,.tabs button,.tabs button::before,.tabs button::after,.st i,.ibtn,.pip.on{border-color:color-mix(in srgb,var(--c,var(--line)) 62%,#1f2a4d)}
.tile{box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,#1f2a4d)}
.part .pn,.skb{box-shadow:0 2px 0 color-mix(in srgb,var(--c) 70%,#1f2a4d)}
.tabs button.on{box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#141c36)}
.ibtn{--c:var(--blue);box-shadow:0 3px 0 color-mix(in srgb,var(--blue) 70%,#1f2a4d)}
.btn.p{border-color:color-mix(in srgb,var(--yellow) 55%,#6b4a00);box-shadow:0 3px 0 color-mix(in srgb,var(--yellow) 60%,#7a5200)}
.lbl{border-color:color-mix(in srgb,var(--lc,var(--yellow)) 55%,#1f2a4d);box-shadow:2px 2px 0 color-mix(in srgb,var(--lc,var(--yellow)) 55%,#1f2a4d)}
.chip.y{border-color:color-mix(in srgb,var(--yellow) 55%,#6b4a00)}.chip.a{border-color:color-mix(in srgb,var(--blue) 60%,#1f2a4d)}
.chip.ok{border-color:color-mix(in srgb,var(--green) 60%,#1f2a4d)}.chip.bad{border-color:color-mix(in srgb,var(--red) 60%,#1f2a4d)}
.opt.ok{border-color:color-mix(in srgb,var(--green) 60%,#1f2a4d);box-shadow:0 3px 0 color-mix(in srgb,var(--green) 65%,#1f2a4d)}
.opt.bad{border-color:color-mix(in srgb,var(--red) 60%,#1f2a4d);box-shadow:0 3px 0 color-mix(in srgb,var(--red) 65%,#1f2a4d)}
.tower{border-color:color-mix(in srgb,var(--green) 70%,#1f2a4d);background-color:color-mix(in srgb,var(--green) 62%,#fff)}
.toast{border-color:color-mix(in srgb,var(--yellow) 55%,#6b4a00);box-shadow:0 4px 0 color-mix(in srgb,var(--yellow) 60%,#7a5200)}

/* kotak jawaban: satu warna garis, sederhana */
.opt,.promo{border:1.5px solid #cdd7ea;box-shadow:0 2px 0 #dbe3f1}
.opt .k{background:#eef2f9;color:var(--muted);border:1.5px solid #cdd7ea}
.opt.ok,.promo.ok{background:var(--ok-soft);color:var(--text);border-color:var(--green);box-shadow:0 2px 0 #dbe3f1}
.opt.bad,.promo.bad{background:var(--bad-soft);color:var(--text);border-color:var(--red);box-shadow:0 2px 0 #dbe3f1}
.opt.ok .k{background:var(--green);color:#fff;border-color:var(--green)}
.opt.bad .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.sel{border-color:var(--blue)}
.fb{border:1.5px dashed #b9c6de;background:#f3f6fc}
@media (prefers-color-scheme:dark) and (max-width:0px){.fb{border-color:#3d4a66;background:var(--base)}.opt,.promo,.opt .k{border-color:#3d4a66}.opt,.promo{box-shadow:0 2px 0 rgba(0,0,0,.25)}.opt .k{background:#313c55}}

/* ===== MODE TERANG + LATAR BERGAMBAR ===== */
:root{color-scheme:light}
body{background:linear-gradient(180deg,#dcecff 0%,#eaf4ff 45%,#f4f9ff 100%) fixed!important;background-image:none}
body{background:linear-gradient(180deg,#dcecff 0%,#eaf4ff 45%,#f4f9ff 100%) fixed}
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.scene .cloud{position:absolute;opacity:.9}
.scene .fbrick{position:absolute;width:38px;opacity:.55;transform:rotate(var(--r));animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:rotate(var(--r)) translateY(-10px)}}
.scene .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px}
.hero{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;min-height:168px;margin:-6px 0 10px}
.hero .masc{width:178px;height:178px;flex:none;margin-right:-10px;animation:hop 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:none}45%{transform:translateY(-6px) rotate(-1.5deg)}55%{transform:translateY(-6px) rotate(1.5deg)}}
.hero .bubble{position:relative;align-self:center;margin-bottom:38px;background:#fff;border:2px solid #b9c9e6;border-radius:16px;padding:10px 13px;font-size:13.5px;font-weight:600;line-height:1.4;color:var(--text);box-shadow:0 3px 0 #d3e0f3;max-width:62%}
.hero .bubble::after{content:'';position:absolute;right:-9px;bottom:16px;width:14px;height:14px;background:#fff;border-right:2px solid #b9c9e6;border-bottom:2px solid #b9c9e6;transform:rotate(-45deg);border-radius:0 0 4px 0}
.intro{background:rgba(255,255,255,.85)}

/* header sebagai balok */
.top{padding:11px 12px 11px 13px;margin:14px 0 6px;border-radius:14px}
.top .logo svg{width:36px;height:36px}
.ttl{font-family:"Lilita One","Rubik",sans-serif;font-weight:400;font-size:23px;line-height:1;letter-spacing:.3px;color:var(--text)}
.sub{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:600;color:var(--muted);background:#eef3fb;border:1.5px solid #cdd7ea;border-radius:6px;padding:1px 7px}
.top .ibtn{width:36px;height:36px}

/* header balok merah */
.top{--c:var(--red);background:var(--red);border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d);box-shadow:0 5px 0 color-mix(in srgb,var(--red) 68%,#1f2a4d)}
.top .st i{background:var(--red);border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d)}
.top .st i::after{content:'';display:block;margin:2px 0 0 4px;width:7px;height:3px;border-radius:2px;background:#fff;opacity:.45}
.top .ttl{color:#fff;text-shadow:0 2px 0 color-mix(in srgb,var(--red) 65%,#1f2a4d)}
.top .sub{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.45);color:#fff}
.top .logo svg rect:nth-child(-n+3){fill:var(--yellow);stroke:#9a6f00}
.top .logo svg rect:nth-child(4){fill:var(--blue);stroke:#2b4f99}
.top .ibtn{background:var(--blue);border-color:#2b4f99;box-shadow:0 3px 0 #2b4f99}

/* gelembung lebih ringkas, beri jarak dari maskot */
.hero{gap:22px}
.hero .bubble{max-width:52%;font-size:12.5px;padding:8px 11px;border-radius:13px;margin-left:0;margin-bottom:44px}
.hero .bubble::after{right:-8px;width:12px;height:12px}
.hero .masc{margin-right:-4px}

/* jarak & ketajaman */
.gap-top{height:22px}
.lbl{transform:none;box-shadow:0 2px 0 color-mix(in srgb,var(--lc,var(--yellow)) 55%,#1f2a4d)}
.mtower{gap:7px 4px;padding-top:8px;margin-bottom:2px}
.mtower .b{width:22px;height:12px;border-width:1.5px;border-radius:3px}
.mtower .b::before,.mtower .b::after{width:6px;height:4px;top:-5.5px;border-width:1.5px}
.b,.b::before,.b::after,.st i,.tile,.part .pn,.skb{backface-visibility:hidden}
.scene .fbrick{opacity:.4;filter:none}
.swipe{margin-top:22px}
.scard{justify-content:center;padding:22px 20px}
.b.x,.b.x::before,.b.x::after{background:var(--gray)!important;border-color:#9eabc4!important}

/* variasi posisi maskot */
body{overflow-x:hidden}
.hero .mw{flex:none;display:block;transform-origin:50% 100%}
.hero .mw .masc{margin:0}
.hero.L{flex-direction:row-reverse}
.hero.L .bubble::after{right:auto;left:-8px;transform:rotate(135deg)}
.hero.R.peek .mw{transform:translateX(42px) rotate(-16deg);margin-left:-30px}
.hero.L.peek .mw{transform:translateX(-42px) rotate(16deg);margin-right:-30px}
.hero.L.tilt .mw{transform:rotate(9deg) translateY(4px)}
.hero.R.tilt .mw{transform:rotate(-8deg) translateY(4px)}
.hero.flip .mw .masc{transform:scaleX(-1);animation:none}
.hero.flip .mw{animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-8deg) translateY(4px)}50%{transform:rotate(-3deg) translateY(-2px)}}
.hero.peek .bubble{max-width:56%}

/* jembatan benar/salah */
.bsrows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bsrow{padding:9px 10px;border-radius:10px;background:var(--plate);border:1.5px solid #cdd7ea;box-shadow:0 2px 0 #dbe3f1}
.bsrow.ok{background:var(--ok-soft);border-color:var(--green)}.bsrow.bad{background:var(--bad-soft);border-color:var(--red)}
.bst{font-size:14px;line-height:1.4}
.bsn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:#eef2f9;border:1.5px solid #cdd7ea;color:var(--muted);font-size:11.5px;font-weight:700;margin-right:7px;vertical-align:1px}
.bsbtns{display:flex;gap:6px;margin-top:8px}
.bsb{flex:1;font-size:11.5px;font-weight:700;padding:6px 4px;border-radius:8px;border:1.5px solid #cdd7ea;background:#f6f8fc;color:var(--muted);letter-spacing:.2px}
.bsb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.bsb.key{background:var(--green);border-color:var(--green);color:#fff}
.bsb.wrong{background:var(--red);border-color:var(--red);color:#fff}

:root{--purple:#8f7ae8}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nm{padding:5px 10px;border-radius:8px;border:1.5px solid #cdd7ea;background:#fff;font-weight:600;font-size:13px;box-shadow:0 2px 0 #dbe3f1}
.nm.sel{background:var(--blue);color:#fff;border-color:var(--blue)}.nm.used{opacity:.4}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.seat{min-height:58px;border-radius:10px;border:1.5px dashed #b9c6de;background:#f6f8fc;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;word-break:break-word}
.seat small{font-size:10px;color:var(--muted);font-weight:600}
.seat.f{border-style:solid;border-color:color-mix(in srgb,var(--lime) 60%,#1f2a4d);background:var(--lime);color:#2c3a14}
.seat.f small{color:#2c3a14;opacity:.7}
.seq{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seq span{min-width:44px;padding:9px 6px;text-align:center;border-radius:9px;background:#fff;border:1.5px solid #cdd7ea;font-weight:700;font-size:17px;box-shadow:0 2px 0 #dbe3f1}
.seq span.q{background:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 55%,#6b4a00)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ================= DATA DASAR ================= */
const KEY='nalarHarian.v1', KEY_RING='nalarHarian:ringkasan';
const SKILLS={N1:'Membongkar argumen',N2:'Logika pernyataan',N3:'Kuantor',N4:'Logika cerita & kualitas simpulan',N5:'Penalaran induktif',N6:'Korelasi & kausalitas',N7:'Memperkuat & memperlemah',N8:'Nalar angka sehari-hari'};
const SKILL_DESC={N1:'klaim, alasan, asumsi tersembunyi',N2:'negasi, dan, atau, jika-maka, kontraposisi',N3:'semua, sebagian, tidak ada, dan penyangkalannya',N4:'logika dalam cerita; pasti, mungkin, tidak dapat dinilai',N5:'generalisasi, analogi, definisi',N6:'korelasi vs sebab, penjelasan alternatif, pemoderasi',N7:'penguat, pelemah, asumsi, informasi yang perlu dicek, strategi',N8:'persen, rasio, membaca data, kecukupan informasi, pola (membaca angka, bukan hitungan panjang)'};

const BENTUK=['','lama','2026','2027'];
const KONTEKS=['chat grup','promo dan iklan toko','pengumuman dan syarat','klaim kesehatan di media sosial','hasil survei dan grafik','debat di kolom komentar','keputusan pribadi','aturan permainan dan jadwal'];
const LANGKAH=['Bongkar','Nilai','Putuskan'];
const JENIS_LBL={tandai:'Tandai peran kalimat',bentuk:'Pilih bentuk logika',sah:'Sah atau tidak',kalibrasi:'Kalibrasi kepastian',celah:'Cari celah',perlu_dicek:'Yang perlu dicek',penjelasan:'Penjelasan lain',baca_angka:'Baca angka',keputusan:'Putuskan'};

/* ================= UTIL ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fmtRp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const ymd=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const today=()=>ymd(new Date());
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)}
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function tglPanjang(s){const d=new Date(s+'T12:00:00');return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()}
function tglPendek(s){const d=new Date(s+'T12:00:00');return d.getDate()+' '+BULAN[d.getMonth()]}
/* balok & warna */
const COL={pem:'var(--yellow)',kas:'var(--red)',jem:'var(--blue)',kal:'var(--green)'};
const SKCOL={N1:'var(--red)',N2:'var(--yellow)',N3:'var(--blue)',N4:'var(--green)',N5:'var(--orange)',N6:'var(--sky)',N7:'var(--pink)',N8:'var(--lime)'};
const DARKTXT=['var(--yellow)','var(--lime)','var(--sky)'];
const yk=c=>DARKTXT.includes(c)?'yk':'';
const studs=(n,c,right)=>`<span class="st${right?' r':''}"${c?` style="--c:${c}"`:''}>${'<i></i>'.repeat(n)}</span>`;
function seqPush(s,code){(s.seq||(s.seq=[])).push(code)}
let LT=-1;
function tower(s,mini){let q=s.seq;if(!q){q=[];[['p','pem'],['k','kas'],['j','jem']].forEach(([c,k])=>{for(let i=0;i<s[k].n;i++)q.push(c+(i<s[k].b?1:0))})}
  const C={p:COL.pem,k:COL.kas,j:COL.jem};const isNew=LT>=0&&q.length>LT;LT=q.length;
  return`<div class="${mini?'mtower':'tower'}">${q.map((x,i)=>`<span class="b${x[1]==='0'?' x':''}${isNew&&i===q.length-1?' new':''}" style="--c:${C[x[0]]}"></span>`).join('')}</div>`}
/* opsi teracak dengan kunci dan label jebakan ikut */
function mkOpts(items){const s=shuffle(items);return{opsi:s.map(x=>x.t),kunci:s.findIndex(x=>x.ok),j:s.map(x=>x.ok?null:(x.j||null))}}

/* ================= STATE ================= */
function blank(){const sk={};for(const k in SKILLS)sk[k]={tahap:1,r:[]};return{skills:sk,paket:{},sesi:{},jurnal:[],log:[],salah:[],games:{},contohDipakai:false}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.skills){const b=blank();return Object.assign(b,o,{skills:Object.assign(b.skills,o.skills)})}}catch(e){}return blank()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function sesi(t){return S.sesi[t]||(S.sesi[t]={fase:0,pem:{b:0,n:0},kas:{b:0,n:0},jem:{b:0,n:0},selesai:false,lengkap:false,paketId:null})}

function record(src,sk,ok,j,q){
  if(S.snapDay!==today()){S.snapDay=today();S.snapSkills=JSON.parse(JSON.stringify(S.skills))}
  S.log.push({t:today(),src,sk,ok:ok?1:0,j:ok?null:(j||null)});
  if(S.log.length>3000)S.log=S.log.slice(-3000);
  if(!ok&&q){S.salah.push(Object.assign({id:Date.now()+''+Math.random().toString(36).slice(2,6),t:today(),src,sk,tuntas:false},q));if(S.salah.length>80)S.salah=S.salah.slice(-80)}
  if((src==='kasus'||src==='jembatan')&&S.skills[sk]){
    const st=S.skills[sk];st.r.push(ok?1:0);if(st.r.length>10)st.r=st.r.slice(-10);
    if(st.r.length>=10&&st.r.reduce((a,b)=>a+b,0)>=8&&st.tahap<3){st.tahap++;st.r=[];setTimeout(()=>toast(sk+' naik ke Tahap '+st.tahap+' · '+TAHAP[st.tahap]),400)}
  }
  save();
}
function streak(){let d=today();if(!(S.sesi[d]&&S.sesi[d].selesai))d=addDays(d,-1);let n=0;while(S.sesi[d]&&S.sesi[d].selesai){n++;d=addDays(d,-1)}return n}
function writeRingkasan(){
  const t=today(),s=sesi(t);const butir=s.pem.n+s.kas.n+s.jem.n,benar=s.pem.b+s.kas.b+s.jem.b;
  let prev={};try{prev=JSON.parse(localStorage.getItem(KEY_RING))||{}}catch(e){}
  const riwayat=prev.riwayat||{};riwayat[t]={selesai:s.selesai,butir,akurasi:butir?Math.round(benar/butir*100):0};
  Object.keys(riwayat).sort().slice(0,-30).forEach(k=>delete riwayat[k]);
  const o={app:'nalar-harian',tgl:t,selesai:s.selesai,lengkap:s.lengkap,butir,benar,akurasi:butir?Math.round(benar/butir*100):0,beruntun:streak(),diperbarui:new Date().toISOString(),riwayat};
  try{localStorage.setItem(KEY_RING,JSON.stringify(o))}catch(e){}
}

function pq(){const c=rnd(COND);return{P:{pos:c[0][0],neg:c[0][1]},Q:{pos:c[1][0],neg:c[1][1]}}}
const WARM={
  negAnd(){const{P,Q}=pq();return Object.assign({sk:'N2',label:'Ingkaran',teks:`“${cap(P.pos)} dan ${Q.pos}.”`,
    why:'Ingkaran “p dan q” adalah “bukan p atau bukan q”: cukup salah satunya tidak terjadi.'},mkOpts([
    {t:`${cap(P.neg)} atau ${Q.neg}.`,ok:1},{t:`${cap(P.neg)} dan ${Q.neg}.`,j:'J3'},{t:`${cap(P.pos)} atau ${Q.pos}.`,j:'J3'},{t:`${cap(P.neg)} dan ${Q.pos}.`,j:'J3'}]))},
  negOr(){const{P,Q}=pq();return Object.assign({sk:'N2',label:'Ingkaran',teks:`“${cap(P.pos)} atau ${Q.pos}.”`,
    why:'Ingkaran “p atau q” adalah “bukan p dan bukan q”: keduanya harus tidak terjadi.'},mkOpts([
    {t:`${cap(P.neg)} dan ${Q.neg}.`,ok:1},{t:`${cap(P.neg)} atau ${Q.neg}.`,j:'J3'},{t:`${cap(P.pos)} dan ${Q.neg}.`,j:'J3'},{t:`${cap(P.neg)} atau ${Q.pos}.`,j:'J3'}]))},
  negIf(){const{P,Q}=pq();return Object.assign({sk:'N2',label:'Ingkaran',teks:`“Jika ${P.pos}, maka ${Q.pos}.”`,
    why:'Ingkaran “jika p maka q” adalah “p dan bukan q”: syaratnya terjadi, akibatnya tidak.'},mkOpts([
    {t:`${cap(P.pos)} dan ${Q.neg}.`,ok:1},{t:`Jika ${P.neg}, maka ${Q.neg}.`,j:'J2'},{t:`Jika ${Q.pos}, maka ${P.pos}.`,j:'J1'},{t:`${cap(P.neg)} dan ${Q.pos}.`,j:'J3'}]))},
  setara(){const{P,Q}=pq();const k=Math.random()<.6?`Jika ${Q.neg}, maka ${P.neg}.`:`${cap(P.neg)} atau ${Q.pos}.`;
    return Object.assign({sk:'N2',label:'Pernyataan yang setara',teks:`“Jika ${P.pos}, maka ${Q.pos}.”`,
    why:'“Jika p maka q” setara dengan kontraposisinya “jika bukan q maka bukan p”, dan dengan “bukan p atau q”.'},mkOpts([
    {t:k,ok:1},{t:`Jika ${Q.pos}, maka ${P.pos}.`,j:'J1'},{t:`Jika ${P.neg}, maka ${Q.neg}.`,j:'J2'},{t:`${cap(P.pos)} dan ${Q.neg}.`,j:'J3'}]))},
  sah(){const{P,Q}=pq();const f=rnd(['MP','MT','KONV','INV']);
    const pre=`Jika ${P.pos}, maka ${Q.pos}.\n`;let teks,ok,why,jw;
    if(f==='MP'){teks=pre+`${cap(P.pos)}.\nJadi, ${Q.pos}.`;ok=true;why='Sah (modus ponens): syarat terpenuhi, akibatnya pasti terjadi.'}
    if(f==='MT'){teks=pre+`${cap(Q.neg)}.\nJadi, ${P.neg}.`;ok=true;why='Sah (modus tollens): akibatnya tidak terjadi, berarti syaratnya juga tidak.'}
    if(f==='KONV'){teks=pre+`${cap(Q.pos)}.\nJadi, ${P.pos}.`;ok=false;jw='J1';why='Tidak sah: membalik implikasi. q bisa terjadi karena hal lain.'}
    if(f==='INV'){teks=pre+`${cap(P.neg)}.\nJadi, ${Q.neg}.`;ok=false;jw='J2';why='Tidak sah: menyangkal anteseden. Aturan tidak menyebut apa yang terjadi bila p tidak terjadi.'}
    return{sk:'N2',label:'Sah atau tidak sah?',teks,opsi:['Sah','Tidak sah'],kunci:ok?0:1,j:ok?[null,null]:[jw,null],why}},
  negQ(){const[s,p,np]=rnd(QB);if(Math.random()<.55)return Object.assign({sk:'N3',label:'Ingkaran',teks:`“Semua ${s} ${p}.”`,why:'Ingkaran “semua … ” adalah “ada … yang tidak”. Satu contoh yang tidak sudah cukup.'},mkOpts([
      {t:`Ada ${s} yang ${np}.`,ok:1},{t:`Semua ${s} ${np}.`,j:'J4'},{t:`Tidak ada ${s} yang ${p}.`,j:'J4'},{t:`Ada ${s} yang ${p}.`,j:'J4'}]));
    return Object.assign({sk:'N3',label:'Ingkaran',teks:`“Ada ${s} yang ${p}.”`,why:'Ingkaran “ada … yang …” adalah “semua … tidak …”.'},mkOpts([
      {t:`Semua ${s} ${np}.`,ok:1},{t:`Ada ${s} yang ${np}.`,j:'J4'},{t:`Semua ${s} ${p}.`,j:'J4'},{t:`Sebagian ${s} ${p}.`,j:'J4'}]))},
  kalib(){const[s,p,np,x]=rnd(QB);const f=rnd(['A','B','C','D','E']);const O=['Pasti benar','Belum tentu','Pasti salah'];let teks,k,why,jw=['J6',null,'J6'];
    if(f==='A'){teks=`Semua ${s} ${p}.\n${x} termasuk ${s}.\n\nSimpulan: ${x} ${p}.`;k=0;why='Semua anggota kelompok punya sifat itu, dan ia anggota kelompok. Pasti benar.';jw=[null,'J6','J6']}
    if(f==='B'){teks=`Semua ${s} ${p}.\n${x} ${p}.\n\nSimpulan: ${x} termasuk ${s}.`;k=1;why='Yang punya sifat itu bisa saja dari luar kelompok. Belum tentu (membalik arah).';jw=['J1',null,'J6']}
    if(f==='C'){teks=`Semua ${s} ${p}.\n${x} ${np}.\n\nSimpulan: ${x} termasuk ${s}.`;k=2;why='Kalau ia anggota kelompok, ia pasti punya sifat itu. Karena tidak, ia pasti bukan anggota.';jw=['J6','J6',null]}
    if(f==='D'){teks=`Sebagian ${s} ${p}.\n${x} termasuk ${s}.\n\nSimpulan: ${x} ${p}.`;k=1;why='“Sebagian” tidak menjamin anggota tertentu. Belum tentu.';jw=['J4',null,'J6']}
    if(f==='E'){teks=`Tidak ada ${s} yang ${p}.\n${x} termasuk ${s}.\n\nSimpulan: ${x} ${p}.`;k=2;why='Tidak ada anggota yang punya sifat itu, jadi simpulan pasti salah.';jw=['J6','J6',null]}
    return{sk:f==='D'?'N3':'N4',label:'Seberapa pasti?',teks,opsi:O,kunci:k,j:jw,why}}
};
function genWarmup(n){const pool=shuffle(['negIf','setara','sah','negQ','kalib','negAnd','negOr','sah','kalib','negQ','setara']).slice(0,n);return pool.map(t=>WARM[t]())}

function parsePaste(txt){const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)throw new Error('Tidak menemukan blok JSON.');return JSON.parse(txt.slice(a,b+1))}
function validate(o){
  const E=[];const isArr=Array.isArray;
  if(!o||!isArr(o.paket)||!o.paket.length){E.push('Harus ada "paket" berupa daftar.');return E}
  o.paket.forEach((p,i)=>{const w=`paket[${i}]`;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(p.tgl||''))E.push(`${w}.tgl harus berformat YYYY-MM-DD.`);
    const k=p.kasus;if(!k){E.push(`${w}.kasus tidak ada.`);return}
    if(!SKILLS[k.keterampilan])E.push(`${w}.kasus.keterampilan harus N1–N8.`);
    if(!isArr(k.kalimat)||k.kalimat.length<2)E.push(`${w}.kasus.kalimat minimal 2.`);
    if(!isArr(k.langkah)||!k.langkah.length)E.push(`${w}.kasus.langkah kosong.`);
    else k.langkah.forEach((l,j)=>{const lw=`${w}.kasus.langkah[${j}]`;
      if(l.jenis==='tandai'){if(!isArr(l.peran)||!isArr(k.kalimat)||l.peran.length!==k.kalimat.length)E.push(`${lw}.peran harus sepanjang kalimat.`);else if(l.peran.some(r=>!PERAN.includes(r)))E.push(`${lw}.peran hanya boleh: ${PERAN.join(', ')}.`)}
      else{if(!isArr(l.opsi)||l.opsi.length<2)E.push(`${lw}.opsi minimal 2.`);else if(!(Number.isInteger(l.kunci)&&l.kunci>=0&&l.kunci<l.opsi.length))E.push(`${lw}.kunci di luar rentang.`)}
    });
    if(!isArr(p.jembatan)||!p.jembatan.length)E.push(`${w}.jembatan kosong.`);
    else p.jembatan.forEach((q,j)=>{const qw=`${w}.jembatan[${j}]`;
      const jn=q.jenis||'pg';
      if(jn==='bs'){if(!isArr(q.pernyataan)||q.pernyataan.length<3||q.pernyataan.length>5)E.push(`${qw}.pernyataan harus 3–5 baris.`);
        else if(!isArr(q.kunci)||q.kunci.length!==q.pernyataan.length||q.kunci.some(x=>typeof x!=='boolean'))E.push(`${qw}.kunci harus daftar true/false sepanjang pernyataan.`)}
      else if(jn!=='pg')E.push(`${qw}.jenis harus "pg" atau "bs".`);
      else if(!isArr(q.opsi)||q.opsi.length<4)E.push(`${qw}.opsi minimal 4.`);
      else{if(!(Number.isInteger(q.kunci)&&q.kunci>=0&&q.kunci<q.opsi.length))E.push(`${qw}.kunci di luar rentang.`);
        if(q.jebakan_opsi&&(!isArr(q.jebakan_opsi)||q.jebakan_opsi.length!==q.opsi.length))E.push(`${qw}.jebakan_opsi harus sepanjang opsi.`)}
      if(!q.teks&&!q.perintah)E.push(`${qw} butuh teks atau perintah.`);
    });
  });return E}

function weekLog(days=7){const from=addDays(today(),-(days-1));return S.log.filter(x=>x.t>=from)}
function accBySkill(log){const m={};log.filter(x=>x.src==='kasus'||x.src==='jembatan').forEach(x=>{(m[x.sk]||(m[x.sk]={b:0,n:0})).n++;if(x.ok)m[x.sk].b++});return m}
function topTraps(log,n=3){const c={};log.forEach(x=>{if(x.j&&TRAPS[x.j])c[x.j]=(c[x.j]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,n)}
function lastPlannedSkill(){const ids=Object.keys(S.paket).filter(k=>k!=='contoh').sort();if(ids.length)return S.paket[ids[ids.length-1]].kasus.keterampilan;
  const k=S.log.filter(x=>x.src==='kasus').pop();return k?k.sk:null}
function nextStart(){const ids=Object.keys(S.paket).filter(k=>/^\d/.test(k)).sort();const t=today();
  let d=ids.length?addDays(ids[ids.length-1],1):t;if(d<t)d=t;if(d===t&&S.sesi[t]&&S.sesi[t].fase>=2)d=addDays(t,1);return d}
function buildPlan(n,start){
  const order=Object.keys(SKILLS);const last=lastPlannedSkill();let idx=last?(order.indexOf(last)+1)%8:0;
  const acc=accBySkill(weekLog(7));let weak=null,wv=1;for(const k in acc){const a=acc[k].b/acc[k].n;if(acc[k].n>=3&&a<.7&&a<wv){wv=a;weak=k}}
  const seq=[];if(weak&&weak!==last)seq.push(weak);while(seq.length<n){const k=order[idx];idx=(idx+1)%8;if(seq[seq.length-1]!==k)seq.push(k)}
  const recent=new Set();Object.keys(S.paket).forEach(k=>{if(k>=addDays(start,-10))recent.add(S.paket[k].kasus.konteks)});
  let ci=Math.floor(Math.random()*8);const plan=[];
  for(let i=0;i<n;i++){let c=null;for(let t=0;t<8;t++){const cand=KONTEKS[(ci+t)%8];if(!recent.has(cand)){c=cand;ci=(ci+t+1)%8;break}}
    if(!c){c=KONTEKS[ci%8];ci++}recent.add(c);if(recent.size>=8)recent.clear();
    const sk=seq[i],th=S.skills[sk].tahap;plan.push({tgl:addDays(start,i),sk,tahap:th,konteks:c,bentuk:BENTUK[th]})}
  return plan}

/* --- pemanasan --- */
function startPem(){PEM={cards:genWarmup(8),i:0,locked:false,end:Date.now()+180000};clearInterval(pemTimer);pemTimer=setInterval(tickPem,500)}
function tickPem(){if(!PEM||route!=='hari-ini'){return}const left=Math.max(0,PEM.end-Date.now());const el=$('#ptime');if(el){el.textContent=Math.floor(left/60000)+':'+String(Math.floor(left/1000)%60).padStart(2,'0');$('#pbar').style.width=(left/1800)+'%'}
  if(left<=0&&!PEM.locked)endPem()}
function endPem(){clearInterval(pemTimer);PEM=null;const s=sesi(today());s.fase=2;save();render()}
function vPem(s){if(!PEM)startPem();const c=PEM.cards[PEM.i];
  return`<div class="row sp" style="margin:2px 2px 0"><span class="lbl">Pemanasan kilat · ${PEM.i+1}/${PEM.cards.length}</span><span class="chip y" id="ptime">3:00</span></div>
  ${tower(s,1)}<div class="bar" style="margin:8px 0 22px"><i id="pbar" style="width:100%"></i></div>
  <div class="glass card has-st" style="--c:var(--yellow)">${studs(3,COL.pem)}<div class="cap">${c.label}</div><div class="stim" style="font-weight:600">${esc(c.teks)}</div>
  <div class="opts" id="popts" style="--c:var(--orange)">${c.opsi.map((o,i)=>`<button class="opt" data-act="pem" data-v="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="pfb"></div></div>
  <div class="row sp tiny muted" style="padding:0 4px"><span>Benar ${s.pem.b} dari ${s.pem.n}</span><button class="btn sm" data-act="endPem">Akhiri pemanasan</button></div>`}
function answerPem(i){if(!PEM||PEM.locked)return;PEM.locked=true;const c=PEM.cards[PEM.i],s=sesi(today()),ok=i===c.kunci;
  s.pem.n++;if(ok)s.pem.b++;seqPush(s,'p'+(ok?1:0));record('pemanasan',c.sk,ok,c.j[i]);
  markOpts('#popts',i,c.kunci);
  if(ok){setTimeout(nextPem,650)}else{$('#pfb').innerHTML=`<div class="fb"><b>Kurang tepat.</b> ${esc(c.why)}${c.j[i]?` <span class="chip bad">${c.j[i]} ${TRAPS[c.j[i]]}</span>`:''}<div style="margin-top:8px"><button class="btn sm p" data-act="nextPem">Lanjut</button></div></div>`}}
function nextPem(){if(!PEM)return;PEM.i++;PEM.locked=false;if(PEM.i>=PEM.cards.length||Date.now()>=PEM.end)endPem();else render()}
function markOpts(sel,chosen,kunci){document.querySelectorAll(sel+' .opt').forEach((b,j)=>{b.disabled=true;if(j===kunci)b.classList.add('ok');else if(j===chosen)b.classList.add('bad');else b.classList.add('dim')})}

/* --- kasus --- */
function vKas(s){
  const pid=getPaketId(s);
  if(!pid){return`<div class="glass card"><div class="lbl">Kasus hari ini</div><h2>Paket hari ini belum ada</h2>
    <p class="small muted">Salin prompt, jalankan di proyek Claude “Nalar Harian”, lalu tempel JSON-nya di halaman Paket. Sesi akan lanjut dari sini.</p>
    <div class="opts"><button class="btn p" data-act="copyPrompt" data-v="1">Salin prompt 1 hari</button><button class="btn" data-act="nav" data-v="paket">Buka halaman Paket</button>
    ${S.contohDipakai?'':'<button class="btn" data-act="pakaiContoh">Coba paket contoh</button>'}
    <button class="btn" data-act="skipKasus">Lewati kasus hari ini</button></div></div>`}
  if(s.paketId!==pid){s.paketId=pid;save()}
  const p=S.paket[pid],k=p.kasus;if(!KAS||KAS.pid!==pid)KAS={pid,step:0,roles:{},answered:false,done:false};
  const L=k.langkah,l=L[KAS.step];
  let h=`<div class="row sp wrapf" style="margin:2px 2px 0"><span class="lbl w" style="--lc:var(--red)">Kasus hari ini</span><div class="row"><span class="chip a">${k.keterampilan}</span><span class="chip">T${k.tahap||1}</span><span class="chip">${esc(k.konteks||'')}</span></div></div>${tower(s,1)}`;
  h+=`<div class="glass card has-st" style="margin-top:16px">${studs(4,COL.kas)}<h2>${esc(k.judul||'Kasus')}</h2><div id="ksent">`;
  const tandai=!KAS.done&&l&&l.jenis==='tandai';
  k.kalimat.forEach((x,i)=>{h+=`<div class="sent"><span class="n">${i+1}</span>${esc(x)}`;
    if(tandai){const r=KAS.roles[i];const res=KAS.answered;h+=`<div class="roles">${PERAN.map(pr=>{let c='';if(res){if(pr===l.peran[i])c='ok';else if(pr===r)c='bad'}else if(pr===r)c='sel';return`<button class="role ${c}" data-act="role" data-i="${i}" data-v="${pr}" ${res?'disabled':''}>${pr}</button>`}).join('')}</div>`}
    h+='</div>'});
  h+='</div>';
  if(k.tabel&&Array.isArray(k.tabel.kolom))h+=`<table class="t"><tr>${k.tabel.kolom.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${(k.tabel.baris||[]).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
  h+='</div>';
  if(KAS.done){h+=`<div class="glass card"><div class="cap">Pembahasan kasus</div><div class="small">${esc(k.pembahasan||'')}</div>${k.jebakan&&TRAPS[k.jebakan]?`<div style="margin-top:8px"><span class="chip bad">${k.jebakan} · ${TRAPS[k.jebakan]}</span></div>`:''}
    <button class="btn p w" style="margin-top:12px" data-act="toJem">Lanjut ke Jembatan UTBK</button></div>`;return h}
  h+=`<div class="glass card"><div class="steps">${L.map((_,i)=>`<i class="${i<KAS.step?'done':i===KAS.step?'on':''}"></i>`).join('')}</div>
    <div class="cap">Langkah ${KAS.step+1} · ${LANGKAH[KAS.step]||''} · ${JENIS_LBL[l.jenis]||l.jenis}</div><div style="font-weight:600">${esc(l.perintah||'')}</div>`;
  if(l.jenis==='tandai'){h+=`<p class="tiny muted" style="margin-top:4px">Pilih peran di bawah setiap kalimat di atas.</p>`;
    if(!KAS.answered)h+=`<button class="btn p w" style="margin-top:10px" data-act="cekTandai" ${Object.keys(KAS.roles).length<k.kalimat.length?'disabled':''}>Cek</button>`}
  else h+=`<div class="opts" id="kopts" style="--c:var(--red)">${l.opsi.map((o,i)=>{let c='';if(KAS.answered){c=i===l.kunci?'ok':i===KAS.chosen?'bad':'dim'}return`<button class="opt ${c}" data-act="kasOpt" data-v="${i}" ${KAS.answered?'disabled':''}><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;
  if(KAS.answered)h+=`<div class="fb">${KAS.ok?'<b style="color:var(--ok)">Tepat.</b> ':'<b style="color:var(--bad)">Belum tepat.</b> '}${esc(l.pembahasan||'')}</div><button class="btn p w" style="margin-top:10px" data-act="kasNext">${KAS.step<L.length-1?'Langkah berikutnya':'Lihat pembahasan'}</button>`;
  h+='</div>';return h}
function kasAnswer(ok,q){const s=sesi(today()),k=S.paket[KAS.pid].kasus;s.kas.n++;if(ok)s.kas.b++;seqPush(s,'k'+(ok?1:0));KAS.answered=true;KAS.ok=ok;record('kasus',k.keterampilan,ok,k.jebakan,q);render()}

/* --- jembatan --- */
function bsRows(q,sel,answered,act){const lb=q.label_b||'BENAR',ls=q.label_s||'SALAH';
  return`<div class="bsrows">${q.pernyataan.map((t,i)=>{const v=sel[i];let rc='';if(answered)rc=v===q.kunci[i]?'ok':'bad';
    const bt=(val,lab)=>{let c=v===val?'on':'';if(answered){c=q.kunci[i]===val?'key':(v===val?'wrong':'')}return`<button class="bsb ${c}" data-act="${act}" data-i="${i}" data-v="${val?1:0}" ${answered?'disabled':''}>${esc(lab)}</button>`};
    return`<div class="bsrow ${rc}"><div class="bst"><span class="bsn">${i+1}</span>${esc(t)}</div><div class="bsbtns">${bt(true,lb)}${bt(false,ls)}</div></div>`}).join('')}</div>`}
function vJem(s){const p=s.paketId&&S.paket[s.paketId];if(!p){s.fase=4;save();return vKalimat(s)}
  if(!JEM)JEM={i:0,answered:false,bs:{}};const Q=p.jembatan,q=Q[JEM.i],bs=(q.jenis||'pg')==='bs';
  let h=`<div class="row sp wrapf" style="margin:2px 2px 0"><span class="lbl w" style="--lc:var(--blue)">Jembatan UTBK · ${JEM.i+1}/${Q.length}</span><div class="row"><span class="chip a">${esc(q.keterampilan||p.kasus.keterampilan)}</span>${q.bentuk?`<span class="chip">bentuk ${esc(q.bentuk)}</span>`:''}</div></div>
  ${tower(s,1)}<div class="glass card has-st" style="margin-top:16px">${studs(4,COL.jem)}${q.teks?`<div class="stim">${esc(q.teks)}</div>`:''}<div style="font-weight:600;margin-top:8px">${esc(q.perintah||'')}</div>`;
  if(bs){h+=bsRows(q,JEM.bs,JEM.answered,'bsPick');
    if(!JEM.answered)h+=`<button class="btn p w" style="margin-top:12px" data-act="bsCek" ${Object.keys(JEM.bs).length<q.pernyataan.length?'disabled':''}>Periksa</button>`}
  else h+=`<div class="opts" style="--c:var(--blue)">${q.opsi.map((o,i)=>{let c='';if(JEM.answered){c=i===q.kunci?'ok':i===JEM.chosen?'bad':'dim'}return`<button class="opt ${c}" data-act="jemOpt" data-v="${i}" ${JEM.answered?'disabled':''}><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;
  if(JEM.answered){const jj=bs?q.jebakan:(q.jebakan_opsi||[])[JEM.chosen];h+=`<div class="fb">${JEM.ok?'<b style="color:var(--ok)">Tepat.</b> ':`<b style="color:var(--bad)">Belum tepat.</b> ${bs?`<span class="muted">(${q.pernyataan.filter((_,i)=>JEM.bs[i]===q.kunci[i]).length}/${q.pernyataan.length} baris benar; semua baris harus tepat)</span> `:''}`}${esc(q.pembahasan||'')}${!JEM.ok&&jj&&TRAPS[jj]?`<div style="margin-top:6px"><span class="chip bad">${bs?'Jebakan':'Pilihanmu'}: ${jj} · ${TRAPS[jj]}</span></div>`:''}</div>
    <button class="btn p w" style="margin-top:10px" data-act="jemNext">${JEM.i<Q.length-1?'Soal berikutnya':'Lanjut'}</button>`}
  return h+'</div>'}

/* --- satu kalimat --- */
function vKalimat(s){return`<span class="lbl w" style="--lc:var(--green);margin-left:2px">Satu kalimat nalar</span>${tower(s,1)}<div class="glass card has-st" style="margin-top:16px">${studs(3,COL.kal)}<div class="cap">Boleh dilewati</div><h2>Klaim apa yang kamu dengar hari ini?</h2>
  <p class="small muted">Tulis klaimnya dan apakah alasannya cukup. Contoh: “Kata teman, jalur X paling gampang karena tiga kakak kelas lolos. Alasannya belum cukup, sampelnya kecil.”</p>

/* ================= REKAP ================= */
function vRekap(){const w=weekLog(7);const tr=topTraps(w.filter(x=>x.src!=='game'));
  const ka=w.filter(x=>x.src==='kasus'),je=w.filter(x=>x.src==='jembatan'),pe=w.filter(x=>x.src==='pemanasan');
  const pc=a=>a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):null;
  const pk=pc(ka),pj=pc(je);let interp='Data minggu ini belum cukup untuk dibandingkan.';
  if(ka.length>=3&&je.length>=3){if(pk-pj>=15)interp='Kasus nyata lebih baik daripada jembatan: masalahnya kemungkinan di membaca bentuk soal UTBK.';else if(pj-pk>=15)interp='Jembatan lebih baik daripada kasus nyata: masalahnya kemungkinan di menerapkan logika di luar soal.';else interp='Kasus nyata dan jembatan seimbang. Bagus, logikamu terbawa ke dua arah.'}
  const days=[...Array(7)].map((_,i)=>addDays(today(),i-6));
  let h=`<div class="glass card has-st">${studs(4)}<span class="lbl w" style="--lc:var(--green)">7 hari terakhir</span><div class="days">${days.map(d=>{const s=S.sesi[d];const on=s&&s.selesai;return`<div><span class="b${on?'':' x'}" style="--c:${on?'var(--green)':s&&s.fase>0?'var(--yellow)':'var(--gray)'}"></span><div class="tiny muted" style="margin-top:4px;font-weight:600">${HARI[new Date(d+'T12:00:00').getDay()].slice(0,3)}</div></div>`}).join('')}</div></div>`;
  h+=`<div class="glass card"><div class="cap">Jebakan terbanyak</div>${tr.length?tr.map(([k,c],i)=>`<div class="kv"><span>${i+1}. <b>${k}</b> ${TRAPS[k]}</span><span class="muted">${c}x</span></div>`).join(''):'<div class="small muted">Belum ada jebakan yang menjeratmu minggu ini.</div>'}</div>`;
  h+=`<div class="glass card"><div class="cap">Kasus nyata vs jembatan UTBK</div>
   <div class="kv"><span class="muted">Pemanasan</span><b>${pc(pe)??'–'}${pe.length?'%':''} <span class="tiny muted">(${pe.length})</span></b></div>
   <div class="kv"><span class="muted">Kasus nyata</span><b>${pk??'–'}${ka.length?'%':''} <span class="tiny muted">(${ka.length})</span></b></div>
   <div class="kv"><span class="muted">Jembatan UTBK</span><b>${pj??'–'}${je.length?'%':''} <span class="tiny muted">(${je.length})</span></b></div>
   <div class="small" style="margin-top:6px">${interp}</div></div>`;
  h+=`<div class="glass card"><div class="cap">Tahap keterampilan</div><div class="row wrapf" style="gap:6px;margin-top:4px">${Object.keys(SKILLS).map(k=>`<span class="chip" style="background:${SKCOL[k]};color:${yk(SKCOL[k])?'#2f333d':'#fff'}">${k} · T${S.skills[k].tahap}</span>`).join('')}</div></div>`;
  const sal=S.salah.filter(x=>!x.tuntas).slice(-12).reverse();
  h+=`<h3>Butir salah untuk diulang</h3>`;
  h+=sal.length?`<div class="glass card list">${sal.map(x=>`<div class="it"><div style="flex:1;min-width:0"><div class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.perintah||x.teks||'')}</div><div class="tiny muted">${tglPendek(x.t)} · ${x.src} · ${x.sk}</div></div><button class="btn sm" data-act="ulang" data-v="${x.id}">Ulang</button></div>`).join('')}</div>`:'<div class="glass card empty">Belum ada butir salah.</div>';
  const g=S.games;h+=`<h3>Mini game (pendamping)</h3><div class="glass card">${GAMES.map(x=>`<div class="kv"><span>${x.nama}</span><span class="muted">terbaik ${g[x.id]?g[x.id].best:0} · ${g[x.id]?g[x.id].main:0}x main</span></div>`).join('')}</div>`;
  return h}
let UB=null;
function openUlang(id){const x=S.salah.find(y=>y.id===id);if(!x)return;
  if(x.jenis==='bs'){UB={id,sel:{},answered:false};return renderUlangBS()}
  openSheet(`<div class="row sp"><div class="lbl" style="margin:0">Ulang · ${x.sk}</div><button class="btn sm" data-act="closeSheet">Tutup</button></div>
  ${x.teks?`<div class="stim" style="margin-top:8px">${esc(x.teks)}</div>`:''}<div style="font-weight:600;margin-top:8px">${esc(x.perintah||'')}</div>

/* --- Geser Setara --- */
function genGeser(){const{P,Q}=pq();const base=`Jika ${P.pos}, maka ${Q.pos}.`;const t=rnd(['kontra','kontra','disj','konv','inv','neg']);
  const M={kontra:[`Jika ${Q.neg}, maka ${P.neg}.`,true,'Kontraposisi: setara.'],disj:[`${cap(P.neg)} atau ${Q.pos}.`,true,'“Bukan p atau q” setara dengan “jika p maka q”.'],
   konv:[`Jika ${Q.pos}, maka ${P.pos}.`,false,'Konvers (dibalik): tidak setara · J1.'],inv:[`Jika ${P.neg}, maka ${Q.neg}.`,false,'Invers: tidak setara · J2.'],neg:[`${cap(P.pos)} dan ${Q.neg}.`,false,'Ini ingkarannya, bukan pernyataan setara.']};
  return{base,teks:M[t][0],setara:M[t][1],why:M[t][2]}}
function vGeser(){const c=G.cur;after(bindSwipe);return gHead(`<span class="chip" id="gtime">60 dtk</span>`)+`<div class="row sp small muted" style="padding:0 2px"><span>Skor ${G.score}</span><span>${G.n} kartu</span></div>
  <div class="swipe"><div class="glass scard" id="scard">${studs(4,gc())}<div class="base">Apakah setara dengan: “${esc(c.base)}”</div><div style="font-weight:600">${esc(c.teks)}</div></div></div>
  <div class="row"><button class="btn" style="flex:1" data-act="geser" data-v="0">‹ Tidak setara</button><button class="btn p" style="flex:1" data-act="geser" data-v="1">Setara ›</button></div>
  <div class="fb small" id="gfb" style="${G.last?'':'visibility:hidden'}">${G.last||'·'}</div>`}
function bindSwipe(){const el=$('#scard');if(!el)return;let x0=null,dx=0;
  el.onpointerdown=e=>{x0=e.clientX;dx=0;el.style.transition='none';el.setPointerCapture(e.pointerId)};
  el.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`};
  el.onpointerup=()=>{if(x0===null)return;x0=null;el.style.transition='';if(Math.abs(dx)>70)answerGeser(dx>0);else el.style.transform=''}}
function answerGeser(v){if(!G||G.id!=='geser'||G.over)return;const c=G.cur,ok=v===c.setara;G.n++;if(ok)G.score++;
  G.last=`${ok?'<b style="color:var(--ok)">✓</b>':'<b style="color:var(--bad)">✗</b>'} ${esc(c.why)}`;
  const el=$('#scard');if(el){el.style.transform=`translateX(${v?420:-420}px) rotate(${v?20:-20}deg)`;el.style.opacity='0'}
  G.cur=genGeser();setTimeout(()=>{if(G&&G.id==='geser'&&!G.over)render()},180)}

const VENN_SET=[['peserta lomba sains','anggota OSIS','siswa kelas 12'],['pembeli paket hemat','pelanggan baru','penerima voucher'],['pemain futsal','anggota klub olahraga','siswa yang ikut bimbel'],['buku di rak atas','buku pelajaran','buku pinjaman'],['peserta try out','pendaftar jalur prestasi','alumni SMA Harapan'],['kucing di rumah Ani','hewan yang sudah divaksin','hewan berbulu putih'],['penumpang kereta pagi','pekerja kantoran','pemegang kartu langganan']];
const BIT=[4,2,1];
function vEval(m,s){const inh=r=>(m>>(r-1))&1;for(let r=1;r<=7;r++){const x=r&s.x,y=r&s.y;
  if(s.f==='semua'&&x&&!y&&inh(r))return false;if(s.f==='tidak'&&x&&y&&inh(r))return false;
  if(s.f==='sebagian'&&x&&y&&inh(r))return true;if(s.f==='sebagianBukan'&&x&&!y&&inh(r))return true}
  return s.f==='semua'||s.f==='tidak'}
function vModels(pre){const out=[];for(let m=1;m<128;m++){let ok=true;for(const b of BIT){let any=false;for(let r=1;r<=7;r++)if((r&b)&&((m>>(r-1))&1))any=true;if(!any){ok=false;break}}
  if(ok&&pre.every(s=>vEval(m,s)))out.push(m)}return out}
function vText(s,N){const X=N[BIT.indexOf(s.x)],Y=N[BIT.indexOf(s.y)];return{semua:`Semua ${X} adalah ${Y}.`,tidak:`Tidak ada ${X} yang merupakan ${Y}.`,sebagian:`Sebagian ${X} adalah ${Y}.`,sebagianBukan:`Sebagian ${X} bukan ${Y}.`}[s.f]}
function genVenn(){const F=['semua','tidak','sebagian','sebagianBukan'];const want=rnd([0,1,2,1,0]);let best=null;
  for(let t=0;t<300;t++){const N=rnd(VENN_SET);const ord=(a,b)=>Math.random()<.5?[a,b]:[b,a];
    const[a1,b1]=ord(4,2),[a2,b2]=ord(2,1),[a3,b3]=ord(4,1);

    const tv=M.map(m=>vEval(m,con));const v=tv.every(Boolean)?0:tv.every(x=>!x)?2:1;const q={N,pre,con,M,v};best=q;if(v===want)return q}

const BARANG=['Sepatu','Tas sekolah','Jaket','Headphone','Paket buku','Jam tangan'];
function genKasir(){const types=['bert','tunggal','potong','dp'];let res=null;
  for(let t=0;t<400;t++){const P=rnd([80,100,120,150,180,200,250,300])*1000;
    const pick=Math.random()<.75?['bert',...shuffle(['tunggal','potong','dp']).slice(0,2)]:shuffle(types).slice(0,3);
    const pr=pick.map(k=>{if(k==='bert'){const a=rnd([10,15,20,25,30]),b=rnd([10,15,20,25]);return{l:`Diskon ${a}% + ${b}%`,f:P*(1-a/100)*(1-b/100),why:`${fmtRp(P)} × ${100-a}% × ${100-b}%`}}
      if(k==='tunggal'){const c=rnd([20,25,30,35,40,45]);return{l:`Diskon ${c}%`,f:P*(1-c/100),why:`${fmtRp(P)} × ${100-c}%`}}
      if(k==='potong'){const x=Math.round(P*(.2+Math.random()*.25)/5000)*5000;return{l:`Potongan ${fmtRp(x)}`,f:P-x,why:`${fmtRp(P)} − ${fmtRp(x)}`}}
      const d=rnd([10,15,20]),y=rnd([5000,10000,15000,20000]);return{l:`Diskon ${d}%, lalu potong ${fmtRp(y)}`,f:P*(1-d/100)-y,why:`${fmtRp(P)} × ${100-d}% − ${fmtRp(y)}`}});
    const s=pr.map(x=>x.f).sort((a,b)=>a-b);if(s[1]-s[0]<1000)continue;res={P,pr,item:rnd(BARANG)};if((s[2]-s[0])/P<=.12)return res}
  return res}

const PERMS4=(()=>{const out=[];const go=(a,r)=>{if(!r.length){out.push(a);return}r.forEach((x,i)=>go(a.concat([x]),r.filter((_,j)=>j!==i)))};go([],[0,1,2,3]);return out})();
function cEval(p,c){const r=k=>p.indexOf(k);return{gt:()=>r(c.a)<r(c.b),top:()=>r(c.a)===0,bottom:()=>r(c.a)===3,notTop:()=>r(c.a)!==0,notBottom:()=>r(c.a)!==3}[c.f]()}
function cText(c,N,K){const a=N[c.a],b=N[c.b];return{gt:`${cap(K)} ${a} lebih tinggi daripada ${K} ${b}.`,top:`${a} mendapat ${K} tertinggi.`,bottom:`${a} mendapat ${K} terendah.`,notTop:`${a} tidak mendapat ${K} tertinggi.`,notBottom:`${a} tidak mendapat ${K} terendah.`}[c.f]}
function genCukup(){const target=ri(0,4);let last=null;
  for(let t=0;t<800;t++){const N=shuffle(NAMA).slice(0,4),K=rnd(['nilai try out','skor kuis','poin lomba']);
    const q=Math.random()<.6?{t:'cmp',x:ri(0,3)}:{t:'top'};if(q.t==='cmp'){do{q.y=ri(0,3)}while(q.y===q.x)}
    const mk=()=>{const f=rnd(['gt','gt','top','bottom','notTop','notBottom']);const c={f,a:ri(0,3)};if(f==='gt'){do{c.b=ri(0,3)}while(c.b===c.a)}return c};
    const st=()=>{const n=Math.random()<.45?2:1;const a=[];for(let i=0;i<n;i++)a.push(mk());return a};
    const s1=st(),s2=st();
    if([...s1,...s2].some(c=>q.t==='cmp'&&c.f==='gt'&&((c.a===q.x&&c.b===q.y)||(c.a===q.y&&c.b===q.x))))continue;
    const M1=PERMS4.filter(p=>s1.every(c=>cEval(p,c))),M2=PERMS4.filter(p=>s2.every(c=>cEval(p,c))),M12=M1.filter(p=>s2.every(c=>cEval(p,c)));
    if(!M1.length||!M2.length||!M12.length)continue;
    const ans=p=>q.t==='cmp'?(p.indexOf(q.x)<p.indexOf(q.y)?'ya':'tidak'):N[p[0]];
    const det=M=>new Set(M.map(ans)).size===1;const d1=det(M1),d2=det(M2),d12=det(M12);
    const v=d1&&d2?3:d1?0:d2?1:d12?2:4;
    last={N,K,q,s1,s2,v,d1,d2,d12,jaw:d12?ans(M12[0]):null};if(v===target)return last}
  return last}

  let h=gHead(`<span class="chip">${G.i+1}/${G.n}</span>`)+`<div class="glass card has-st">${gst()}<div class="stim">Empat siswa, yaitu ${N.slice(0,3).join(', ')}, dan ${N[3]}, mendapat ${K} yang berbeda-beda.</div>

  <div class="cap" style="margin-top:10px">Pernyataan</div><div class="stim">(i) ${c.s1.map(x=>esc(cText(x,N,K))).join(' ')}\n(ii) ${c.s2.map(x=>esc(cText(x,N,K))).join(' ')}</div>
  <div class="opts">${CUKUP_OPSI.map((o,i)=>{let cl='';if(G.ans!=null)cl=i===c.v?'ok':i===G.ans?'bad':'dim';return`<button class="opt ${cl}" data-act="cAns" data-v="${i}" ${G.ans!=null?'disabled':''}><span class="k">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`}).join('')}</div>`;
  if(G.ans!=null){const w=b=>b?'<b style="color:var(--ok)">cukup</b>':'<b style="color:var(--bad)">tidak cukup</b>';
    h+=`<div class="fb small">(i) saja: ${w(c.d1)} · (ii) saja: ${w(c.d2)} · bersama: ${w(c.d12)}${c.jaw?`<br>Jawabannya: <b>${esc(c.jaw)}</b>.`:''}<br><span class="muted">Cukup berarti semua urutan yang mungkin memberi jawaban yang sama.</span></div>
    <button class="btn p w" style="margin-top:10px" data-act="cNext">${G.i<G.n-1?'Berikutnya':'Lihat skor'}</button>`}
  return h+'</div>'}

/* --- Kursi Rapat --- */
const PERMS5=(()=>{const out=[];const go=(a,r)=>{if(!r.length){out.push(a);return}r.forEach((x,i)=>go(a.concat([x]),r.filter((_,j)=>j!==i)))};go([],[0,1,2,3,4]);return out})();
function kEval(p,c){const r=k=>p.indexOf(k);switch(c.f){
  case'pos':return r(c.a)===c.k;case'notPos':return r(c.a)!==c.k;case'left':return r(c.a)<r(c.b);case'imm':return r(c.a)+1===r(c.b);
  case'adj':return Math.abs(r(c.a)-r(c.b))===1;case'notAdj':return Math.abs(r(c.a)-r(c.b))!==1;case'end':return r(c.a)===0||r(c.a)===4}}
function kText(c,N){const a=N[c.a],b=N[c.b];return{pos:`${a} duduk di kursi ${c.k+1}.`,notPos:`${a} tidak duduk di kursi ${c.k+1}.`,left:`${a} duduk di sebelah kiri ${b} (tidak harus bersebelahan).`,imm:`${a} duduk tepat di sebelah kiri ${b}.`,adj:`${a} duduk bersebelahan dengan ${b}.`,notAdj:`${a} tidak duduk bersebelahan dengan ${b}.`,end:`${a} duduk di salah satu ujung.`}[c.f]}
const kKey=c=>c.f+':'+c.a+':'+(c.b??'')+':'+(c.k??'');
function genKursi(){for(let t=0;t<600;t++){const N=shuffle(NAMA).slice(0,5);const n=ri(3,4);const cons=[];
    for(let i=0;i<n;i++){const f=rnd(['left','imm','adj','notAdj','end','pos','notPos']);const c={f,a:ri(0,4)};if(['left','imm','adj','notAdj'].includes(f)){do{c.b=ri(0,4)}while(c.b===c.a)}if(f==='pos'||f==='notPos')c.k=ri(0,4);cons.push(c)}
    const sols=PERMS5.filter(p=>cons.every(c=>kEval(p,c)));if(sols.length<2||sols.length>6)continue;
    const cand=[];for(let a=0;a<5;a++){for(let k=0;k<5;k++)cand.push({f:'pos',a,k});cand.push({f:'end',a});for(let b=0;b<5;b++)if(b!==a){cand.push({f:'left',a,b});if(a<b)cand.push({f:'adj',a,b})}}
    const ck=new Set(cons.map(kKey));
    const must=cand.filter(c=>!ck.has(kKey(c))&&sols.every(p=>kEval(p,c))&&!(c.f==='adj'&&cons.some(x=>x.f==='imm'&&((x.a===c.a&&x.b===c.b)||(x.a===c.b&&x.b===c.a))))&&!(c.f==='left'&&cons.some(x=>x.f==='imm'&&x.a===c.a&&x.b===c.b)));
    const maybe=cand.filter(c=>sols.some(p=>kEval(p,c))&&!sols.every(p=>kEval(p,c)));
    if(!must.length||maybe.length<4)continue;
    const items=shuffle([{c:rnd(must),ok:1},...shuffle(maybe).slice(0,4).map(c=>({c}))]);
    return{N,cons,sols,opsi:items.map(x=>kText(x.c,N)),kunci:items.findIndex(x=>x.ok)}}
  return null}
function vKursi(){const q=G.cur,N=q.N;
  let h=gHead(`<span class="chip">${G.i+1}/${G.n}</span>`)+`<div class="glass card has-st">${gst()}<div class="stim">Lima pengurus kelas duduk berjajar di kursi 1–5 (dari kiri ke kanan) saat rapat.</div>
  <div class="cap" style="margin-top:10px">Syarat</div><div class="stim">${q.cons.map((c,i)=>`${i+1}. ${esc(kText(c,N))}`).join('\n')}</div>
  <div class="cap" style="margin-top:12px">Coret-coret: ketuk nama, lalu ketuk kursi</div>
  <div class="names">${N.map((n,i)=>`<button class="nm ${G.selName===i?'sel':''} ${G.place.includes(i)?'used':''}" data-act="kuName" data-v="${i}">${esc(n)}</button>`).join('')}</div>
  <div class="seats">${G.place.map((x,k)=>`<button class="seat ${x!==null?'f':''}" data-act="kuSeat" data-v="${k}"><small>${k+1}</small>${x!==null?esc(N[x]):''}</button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><button class="btn sm" data-act="kuCek">Cek susunanku</button><button class="btn sm" data-act="kuClear">Kosongkan</button></div><div id="kumsg">${G.msg||''}</div>
  <div style="font-weight:600;margin-top:14px">Pernyataan yang PASTI BENAR adalah …</div>
  <div class="opts">${q.opsi.map((o,i)=>{let c='';if(G.ans!=null)c=i===q.kunci?'ok':i===G.ans?'bad':'dim';return`<button class="opt ${c}" data-act="kuAns" data-v="${i}" ${G.ans!=null?'disabled':''}><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;
  if(G.ans!=null)h+=`<div class="fb small">Ada ${q.sols.length} susunan yang memenuhi semua syarat:<br>${q.sols.slice(0,6).map(p=>p.map(k=>esc(N[k])).join(' – ')).join('<br>')}<br><span class="muted">Hanya opsi yang benar di semua susunan itu yang PASTI BENAR.</span></div>
   <button class="btn p w" style="margin-top:10px" data-act="kuNext">${G.i<G.n-1?'Berikutnya':'Lihat skor'}</button>`;
  return h+'</div>'}

/* --- Tren Selang-seling --- */
function genTren(){const type=rnd(['alt2','pm','tm','grow','altmul']);let s=[],d='';
  if(type==='alt2'){const a0=ri(2,12),d1=ri(2,6),b0=ri(18,34),d2=-ri(1,4);for(let i=0;i<7;i++)s.push(i%2===0?a0+d1*(i/2):b0+d2*((i-1)/2));d=`Dua barisan selang-seling: suku ke-1, 3, 5, … naik ${d1}; suku ke-2, 4, 6, … turun ${-d2}.`}
  if(type==='pm'){const a=ri(4,9),b=ri(1,a-1);s=[ri(5,20)];for(let i=1;i<7;i++)s.push(s[i-1]+(i%2?a:-b));d=`Bergantian +${a} lalu −${b}.`}
  if(type==='tm'){const k=ri(1,3);s=[ri(2,5)];for(let i=1;i<7;i++)s.push(i%2?s[i-1]*2:s[i-1]-k);d=`Bergantian ×2 lalu −${k}.`}
  if(type==='grow'){const d0=ri(1,4);s=[ri(1,10)];for(let i=1;i<7;i++)s.push(s[i-1]+d0+i-1);d=`Selisihnya naik 1: +${d0}, +${d0+1}, +${d0+2}, dan seterusnya.`}
  if(type==='altmul'){const a0=ri(1,4),b0=ri(5,15);for(let i=0;i<7;i++)s.push(i%2===0?a0*2**(i/2):b0+3*((i-1)/2));d=`Dua barisan selang-seling: suku ganjil dikali 2; suku genap ditambah 3.`}
  const gap=Math.random()<.5;const idx=gap?ri(2,5):6;const ans=s[idx];
  const prevD=idx>=2?s[idx-1]-s[idx-2]:3;const dis=new Set([ans]);
  [s[idx-1]+prevD,ans+1,ans-1,ans+2,ans-2,ans+prevD,s[idx-2]!==undefined?s[idx-1]+(s[idx-1]-s[idx-2]):ans+3].forEach(x=>{if(dis.size<4&&x>0&&x!==ans)dis.add(x)});
  while(dis.size<4)dis.add(ans+dis.size*3);
  const opsi=shuffle([...dis]);return{show:gap?s:s.slice(0,6),idx,ans,opsi,kunci:opsi.indexOf(ans),d,gap}}
function vTren(){const q=G.cur;
  let h=gHead(`<span class="chip">${G.i+1}/${G.n}</span>`)+`<div class="glass card has-st">${gst()}<div class="cap">${q.gap?'Isi suku yang kosong':'Tentukan suku berikutnya'}</div>
  <div class="seq">${q.show.map((x,i)=>i===q.idx?'<span class="q">?</span>':`<span>${x}</span>`).join('')}${q.gap?'':'<span class="q">?</span>'}</div>
  <div class="grid4">${q.opsi.map((o,i)=>{let c='';if(G.ans!=null)c=i===q.kunci?'ok':i===G.ans?'bad':'dim';return`<button class="opt ${c}" style="justify-content:center;font-weight:700;font-size:17px" data-act="tAns" data-v="${i}" ${G.ans!=null?'disabled':''}>${o}</button>`}).join('')}</div>`;
  if(G.ans!=null)h+=`<div class="fb">${esc(q.d)} Jawabannya <b>${q.ans}</b>.</div><button class="btn p w" style="margin-top:10px" data-act="tNext">${G.i<G.n-1?'Berikutnya':'Lihat skor'}</button>`;
  return h+'</div>'}

/* ================= RESET ================= */
function resetHariIni(){const t=today();
  if(S.snapDay===t&&S.snapSkills)S.skills=JSON.parse(JSON.stringify(S.snapSkills));
  S.log=S.log.filter(x=>x.t!==t);S.salah=S.salah.filter(x=>x.t!==t);
  for(const k in S.paket){if(S.paket[k].dipakai===t)S.paket[k].dipakai=null}
  if(S.paket.contoh&&S.sesi[t]&&S.sesi[t].paketId==='contoh'){delete S.paket.contoh;S.contohDipakai=false}
  delete S.sesi[t];S.snapDay=null;S.snapSkills=null;
  clearInterval(pemTimer);PEM=KAS=JEM=null;LT=-1;save();
  try{const r=JSON.parse(localStorage.getItem(KEY_RING))||{};if(r.riwayat)delete r.riwayat[t];
    Object.assign(r,{tgl:t,selesai:false,lengkap:false,butir:0,benar:0,akurasi:0,beruntun:streak(),diperbarui:new Date().toISOString()});localStorage.setItem(KEY_RING,JSON.stringify(r))}catch(e){}
  closeSheet();nav('hari-ini');toast('Progres hari ini direset')}
function resetSemua(){const keep={};for(const k in S.paket){if(/^\d/.test(k)&&!S.paket[k].dipakai)keep[k]=S.paket[k]}
  const jur=S.jurnal;S=blank();S.paket=keep;S.jurnal=jur;clearInterval(pemTimer);PEM=KAS=JEM=null;LT=-1;save();
  try{localStorage.removeItem(KEY_RING)}catch(e){}
  closeSheet();nav('hari-ini');toast('Semua progres direset')}
function askReset(all){openSheet(`<h2>${all?'Reset semua progres?':'Reset progres hari ini?'}</h2>
  <p class="small muted" style="margin-top:4px">${all?'Tahap N1–N8, riwayat sesi, rekap, butir salah, dan skor mini game kembali ke awal. Stok paket yang belum dipakai dan Jurnal Nalar tetap disimpan.':'Sesi hari ini kembali ke awal: menara, jawaban, tahap keterampilan, dan rekap hari ini dikembalikan seperti sebelum kamu mulai. Paket yang terpakai hari ini kembali ke stok. Catatan jurnal tetap disimpan.'}</p>
  <div class="row" style="margin-top:14px"><button class="btn" style="flex:1" data-act="closeSheet">Batal</button><button class="btn" style="flex:1;background:var(--red);color:#fff;border-color:color-mix(in srgb,var(--red) 62%,#1f2a4d)" data-act="${all?'resetAll':'resetToday'}">Reset</button></div>`)}

/* ================= EVENT ================= */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;const s=sesi(today());
  switch(a){
  case'nav':nav(v);break;
  case'closeSheet':closeSheet();break;
  case'mulai':if(s.fase===0)s.fase=1;save();render();break;
  case'pem':answerPem(+v);break;
  case'nextPem':nextPem();break;
  case'endPem':endPem();break;
  case'copyPrompt':{const n=v?+v:+$('#pdays').value;const st=v?(s.fase>=2&&!s.selesai?today():nextStart()):($('#pstart').value||today());copyText(buildPrompt(n,st),'Prompt tersalin');break}
  case'pakaiContoh':S.paket.contoh=Object.assign(JSON.parse(JSON.stringify(CONTOH)),{dipakai:null});S.contohDipakai=true;s.paketId='contoh';save();render();break;
  case'skipKasus':s.fase=4;save();render();break;
  case'role':KAS.roles[+b.dataset.i]=v;render();break;
  case'cekTandai':{const l=S.paket[KAS.pid].kasus.langkah[KAS.step];const ok=l.peran.every((r,i)=>KAS.roles[i]===r);kasAnswer(ok,null);break}
  case'kasOpt':{const k=S.paket[KAS.pid].kasus,l=k.langkah[KAS.step],i=+v;KAS.chosen=i;const ok=i===l.kunci;
    kasAnswer(ok,{teks:k.kalimat.join(' '),perintah:l.perintah,opsi:l.opsi,kunci:l.kunci,pembahasan:l.pembahasan||k.pembahasan||''});break}
  case'kasNext':{const L=S.paket[KAS.pid].kasus.langkah;if(KAS.step<L.length-1){KAS.step++;KAS.answered=false;KAS.chosen=null}else{KAS.done=true;S.paket[KAS.pid].dipakai=today();save()}render();window.scrollTo(0,0);break}
  case'toJem':s.fase=3;JEM=null;save();render();window.scrollTo(0,0);break;
  case'jemOpt':{const p=S.paket[s.paketId],q=p.jembatan[JEM.i],i=+v;JEM.chosen=i;JEM.answered=true;JEM.ok=i===q.kunci;s.jem.n++;if(JEM.ok)s.jem.b++;seqPush(s,'j'+(JEM.ok?1:0));
    record('jembatan',q.keterampilan&&SKILLS[q.keterampilan]?q.keterampilan:p.kasus.keterampilan,JEM.ok,(q.jebakan_opsi||[])[i],{teks:q.teks,perintah:q.perintah,opsi:q.opsi,kunci:q.kunci,pembahasan:q.pembahasan});render();break}
  case'bsPick':if(!JEM.answered){JEM.bs[+b.dataset.i]=v==='1';render()}break;
  case'bsCek':{const p=S.paket[s.paketId],q=p.jembatan[JEM.i];JEM.answered=true;JEM.ok=q.pernyataan.every((_,i)=>JEM.bs[i]===q.kunci[i]);s.jem.n++;if(JEM.ok)s.jem.b++;seqPush(s,'j'+(JEM.ok?1:0));
    record('jembatan',q.keterampilan&&SKILLS[q.keterampilan]?q.keterampilan:p.kasus.keterampilan,JEM.ok,q.jebakan,{jenis:'bs',teks:q.teks,perintah:q.perintah,pernyataan:q.pernyataan,kunci:q.kunci,label_b:q.label_b,label_s:q.label_s,pembahasan:q.pembahasan});render();break}
  case'ubsPick':if(UB&&!UB.answered){UB.sel[+b.dataset.i]=v==='1';renderUlangBS()}break;
  case'ubsCek':{const x=S.salah.find(y=>y.id===UB.id);UB.answered=true;UB.ok=x.pernyataan.every((_,i)=>UB.sel[i]===x.kunci[i]);S.log.push({t:today(),src:'ulang',sk:x.sk,ok:UB.ok?1:0,j:null});if(UB.ok)x.tuntas=true;save();renderUlangBS();if(UB.ok&&route==='rekap')render();break}
  case'jemNext':{const p=S.paket[s.paketId];if(JEM.i<p.jembatan.length-1){JEM={i:JEM.i+1,answered:false,bs:{}}}else{s.fase=4;JEM=null;save()}render();window.scrollTo(0,0);break}
  case'finish':finishSesi(v==='1');break;
  case'ulang':openUlang(v);break;
  case'ulangOpt':answerUlang(b.dataset.id,+v);break;
  case'jAdd':{const t=$('#jnew').value.trim();if(t){S.jurnal.push({t:today(),teks:t});save();toast('Catatan tersimpan');render()}break}
  case'jCopy':copyText(jurnalPrompt(),'Jurnal tersalin');break;
  case'savePaket':savePaket();break;
  case'delPaket':delete S.paket[v];save();render();break;
  case'backup':copyText(JSON.stringify(S),'Cadangan tersalin');break;
  case'restoreOpen':openSheet(`<h2>Pulihkan dari cadangan</h2><p class="small muted">Tempel teks cadangan. Data sekarang di peramban ini akan diganti.</p><textarea id="rtext" style="min-height:160px;margin-top:8px"></textarea><div class="row" style="margin-top:10px"><button class="btn" style="flex:1" data-act="closeSheet">Batal</button><button class="btn p" style="flex:1" data-act="restore">Pulihkan</button></div>`);break;
  case'askResetToday':askReset(false);break;
  case'askResetAll':askReset(true);break;
  case'resetToday':resetHariIni();break;
  case'resetAll':resetSemua();break;
  case'restore':try{const o=JSON.parse($('#rtext').value);if(!o.skills)throw 0;localStorage.setItem(KEY,JSON.stringify(o));S=load();closeSheet();toast('Data dipulihkan');render()}catch(err){toast('Cadangan tidak valid')}break;
  case'gStart':startGame(v);break;
  case'gBack':clearInterval(gTimer);G=null;render();break;
  case'geser':answerGeser(v==='1');break;
  case'gCard':{const i=+v;G.sel.has(i)?G.sel.delete(i):G.sel.add(i);render();break}
  case'gCheck':{const ok=G.sel.size===2&&G.sel.has(0)&&G.sel.has(3);G.checked=true;G.lastOk=ok;if(ok)G.score++;render();break}
  case'gNext':if(G.i<G.rounds.length-1){G.i++;G.sel=new Set();G.checked=false;render()}else gDone(G.score,G.rounds.length);break;
  case'vAns':{G.ans=+v;if(G.ans===G.cur.v)G.score++;render();break}
  case'vNext':if(G.i<G.n-1){G.i++;G.cur=genVenn();G.ans=null;render()}else gDone(G.score,G.n);break;
  case'dMsg':{G.pick=+v;if(G.pick===G.rounds[G.i].pengalih)G.score++;render();break}
  case'dStep':G.step=1;render();break;
  case'dAns':{G.ans=+v;if(G.ans===G.rounds[G.i].v)G.score++;render();break}
  case'dNext':if(G.i<G.rounds.length-1){G.i++;G.step=0;G.pick=null;G.ans=null;render()}else gDone(G.score,G.rounds.length*2);break;
  case'kAns':answerKasir(+v);break;
  case'hAns':answerHakim(+v);break;
  case'hNext':if(G.i<G.n-1){G.i++;newHakim();render()}else gDone(G.score,G.n);break;
  case'cAns':G.ans=+v;if(G.ans===G.cur.v)G.score++;render();break;
  case'cNext':if(G.i<G.n-1){G.i++;G.cur=genCukup();G.ans=null;render()}else gDone(G.score,G.n);break;
  case'kuName':G.selName=+v;render();break;
  case'kuSeat':{const k=+v;if(G.selName===null){if(G.place[k]!==null){G.selName=G.place[k];G.place[k]=null}}else{const old=G.place.indexOf(G.selName);if(old>=0)G.place[old]=null;G.place[k]=G.selName;G.selName=null}G.msg='';render();break}
  case'kuClear':G.place=[null,null,null,null,null];G.selName=null;G.msg='';render();break;
  case'kuCek':{if(G.place.includes(null)){G.msg='<div class="fb small">Isi kelima kursi dulu.</div>'}else{const bad=G.cur.cons.map((c,i)=>kEval(G.place,c)?null:i+1).filter(Boolean);G.msg=`<div class="fb small">${bad.length?`<b style="color:var(--bad)">Syarat ${bad.join(', ')} belum terpenuhi.</b>`:'<b style="color:var(--ok)">Susunanmu memenuhi semua syarat.</b> Tapi ingat, mungkin ada susunan lain.'}</div>`}render();break}
  case'kuAns':G.ans=+v;if(G.ans===G.cur.kunci)G.score++;render();break;
  case'kuNext':if(G.i<G.n-1){G.i++;G.cur=genKursi();G.ans=null;G.place=[null,null,null,null,null];G.selName=null;G.msg='';render();window.scrollTo(0,0)}else gDone(G.score,G.n);break;
  case'tAns':G.ans=+v;if(G.ans===G.cur.kunci)G.score++;render();break;
  case'tNext':if(G.i<G.n-1){G.i++;G.cur=genTren();G.ans=null;render()}else gDone(G.score,G.n);break;
  case'kNext':if(G.i<G.n-1){G.i++;newKasir();render()}else gDone(G.score,G.n);break;
  }
});
