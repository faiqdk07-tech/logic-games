const BARANG=['Sepatu','Tas sekolah','Jaket','Headphone','Paket buku','Jam tangan'];
function genKasir(){const types=['bert','tunggal','potong','dp'];let res=null;
  for(let t=0;t<400;t++){const P=rnd([80,100,120,150,180,200,250,300])*1000;
    const pick=Math.random()<.75?['bert',...shuffle(['tunggal','potong','dp']).slice(0,2)]:shuffle(types).slice(0,3);
    const pr=pick.map(k=>{if(k==='bert'){const a=rnd([10,15,20,25,30]),b=rnd([10,15,20,25]);return{l:`Diskon ${a}% + ${b}%`,f:P*(1-a/100)*(1-b/100),why:`${fmtRp(P)} × ${100-a}% × ${100-b}%`}}
      if(k==='tunggal'){const c=rnd([20,25,30,35,40,45]);return{l:`Diskon ${c}%`,f:P*(1-c/100),why:`${fmtRp(P)} × ${100-c}%`}}
      if(k==='potong'){const x=Math.round(P*(.2+Math.random()*.25)/5000)*5000;return{l:`Potongan ${fmtRp(x)}`,f:P-x,why:`${fmtRp(P)} − ${fmtRp(x)}`}}
      const d=rnd([10,15,20]),y=rnd([5000,10000,15000,20000]);return{l:`Diskon ${d}%, lalu potong ${fmtRp(y)}`,f:P*(1-d/100)-y,why:`${fmtRp(P)} × ${100-d}% − ${fmtRp(y)}`}});
    const s=pr.map(x=>x.f).sort((a,b)=>a-b);if(s[1]-s[0]<1000)continue;res={P,pr,item:rnd(BARANG)};if((s[2]-s[0])/P<=.12)return res}
  return res}
function newKasir(){G.cur=genKasir();G.ans=null;G.end=Date.now()+15000;clearInterval(gTimer);gTimer=setInterval(()=>{const l=Math.max(0,G.end-Date.now());const e=$('#gtime');if(e)e.textContent=Math.ceil(l/1000)+' dtk';if(l<=0&&G.ans===null)answerKasir(-1)},250)}

function genTren(){const B=roundLv('tren',G.i||0,G.n||8);G.tgn=B.tantangan;const type=gVar(B.lv===1?['alt2','pm','grow']:B.lv===2?['tm','altmul','pm']:['fib','kuadrat','altmul'],G.i||0);let s=[],d='';

  if(type==='alt2'){const a0=ri(2,12),d1=ri(2,6),b0=ri(18,34),d2=-ri(1,4);for(let i=0;i<7;i++)s.push(i%2===0?a0+d1*(i/2):b0+d2*((i-1)/2));d=`Dua barisan selang-seling: suku ke-1, 3, 5, … naik ${d1}; suku ke-2, 4, 6, … turun ${-d2}.`}
  if(type==='pm'){const a=ri(4,9),b=ri(1,a-1);s=[ri(5,20)];for(let i=1;i<7;i++)s.push(s[i-1]+(i%2?a:-b));d=`Bergantian +${a} lalu −${b}.`}
  if(type==='tm'){const k=ri(1,3);s=[ri(2,5)];for(let i=1;i<7;i++)s.push(i%2?s[i-1]*2:s[i-1]-k);d=`Bergantian ×2 lalu −${k}.`}
  if(type==='grow'){const d0=ri(1,4);s=[ri(1,10)];for(let i=1;i<7;i++)s.push(s[i-1]+d0+i-1);d=`Selisihnya naik 1: +${d0}, +${d0+1}, +${d0+2}, dan seterusnya.`}

  case'bkNext':if(gLanjut(G.i<G.n-1)){G.i++;newBukti();render();window.scrollTo(0,0)}else{clearInterval(gTimer);G.phase='quiz';G.qs=[WARM.negQ(),WARM.kalib5()];G.qi=0;G.ans=null;render();window.scrollTo(0,0)}break;
  case'bkAns':{if(G.ans!=null)break;G.ans=+v;const c=G.qs[G.qi],ok=G.ans===c.kunci;if(ok)G.score+=2;S.log.push({t:today(),src:'game',sk:c.sk,ok:ok?1:0,j:ok?null:c.j[G.ans]});save();render();break}
  case'bkQNext':if(G.qi<G.qs.length-1){G.qi++;G.ans=null;render()}else gDone(G.score,0);break;
  case'dMsg':{if(G.pick!==null)break;G.pick=+v;gHit(G.pick===G.rounds[G.i].pengalih);render();break}
  case'dStep':G.step=1;render();break;
  case'dAns':{if(G.ans!==null)break;G.ans=+v;const r=G.rounds[G.i];const ok=G.ans===(r.mode==='cek'?r.cq.kunci:r.v);gHit(ok);gRec('detektif',ok);render();break}
  case'dNext':if(gLanjut(G.i<G.rounds.length-1)){G.i++;G.step=0;G.pick=null;G.ans=null;render()}else gDone(G.score,0);break;
  case'kAns':answerKasir(+v);break;
  case'bPick':belanjaPick(+v);break;
  case'bNext':belanjaNext();break;
  case'bAns':{if(G.ans!=null)break;G.ans=+v;const q=G.qs[G.qi],ok=G.ans===q.kunci;gRec('kasir',ok);if(ok)G.bonus+=5;S.log.push({t:today(),src:'game',sk:'N8',ok:ok?1:0,j:ok?null:q.j[G.ans]});save();render();break}
  case'bQNext':if(G.qi<G.qs.length-1){G.qi++;G.ans=null;render()}else gDone(belanjaSkor(),0);break;
  case'hAns':answerHakim(+v);break;
  case'hNext':if(gLanjut(G.i<G.n-1)){G.i++;newHakim();render()}else gDone(G.score,0);break;
  case'cBuy':cBuy(+v);break;
  case'cAnswer':cAnswer(v);break;
  case'cAns':{if(G.ans!=null)break;G.ans=+v;const ok=G.ans===G.cur.v;gRec('cukup',ok);cCoins(ok?2:-1);S.log.push({t:today(),src:'game',sk:'N8',ok:ok?1:0,j:ok?null:(G.ans===4?'J13':G.cur.v===4?'J6':null)});save();render();break}
  case'cNext':if(G.coins>0&&G.round<G.n){newCukupRound();render();window.scrollTo(0,0)}else gDone(Math.max(0,G.coins),0);break;
  case'kuName':if(Date.now()-(window._noClick||0)<400)break;G.selName=+v;render();break;
  case'kuSeat':{if(Date.now()-(window._noClick||0)<400)break;const k=+v;if(G.selName===null){if(G.place[k]!==null){G.selName=G.place[k];G.place[k]=null}}else{const old=G.place.indexOf(G.selName);if(old>=0)G.place[old]=null;G.place[k]=G.selName;G.selName=null}G.msg='';render();break}
  case'kuClear':G.place=[null,null,null,null,null];G.selName=null;G.msg='';render();break;
  case'kuCek':{if(G.place.includes(null)){G.msg='<div class="fb small">Isi kelima kursi dulu.</div>'}else{const bad=G.cur.cons.map((c,i)=>kEval(G.place,c)?null:i+1).filter(Boolean);G.msg=`<div class="fb small">${bad.length?`<b style="color:var(--bad)">Syarat ${bad.join(', ')} belum terpenuhi.</b>`:'<b style="color:var(--ok)">Susunanmu memenuhi semua syarat.</b> Tapi ingat, mungkin ada susunan lain.'}</div>`}render();break}
  case'kuAns':if(G.ans!=null)break;G.ans=+v;gRec('kursi',G.ans===G.cur.kunci);if(G.ans===G.cur.kunci)G.score+=2;S.log.push({t:today(),src:'game',sk:'N4',ok:G.ans===G.cur.kunci?1:0,j:null});save();render();break;
  case'kuNext':if(G.i<G.n-1){G.i++;newKursi();G.ans=null;G.valid=false;G.place=[null,null,null,null,null];G.selName=null;G.msg='';render();window.scrollTo(0,0)}else gDone(G.score,G.n);break;
  case'tAns':if(G.ans!=null||Date.now()-(window._noClick||0)<400)break;G.ans=+v;gHit(G.ans===G.cur.kunci);gRec('tren',G.ans===G.cur.kunci);render();break;
  case'tNext':if(gLanjut(G.i<G.n-1)){G.i++;G.cur=genTren();G.ans=null;render()}else gDone(G.score,0);break;
  case'kNext':if(G.i<G.n-1){G.i++;newKasir();render()}else gDone(G.score,G.n);break;
  }
});

<style>
.blk{position:fixed;z-index:60;top:0;left:0;width:0;height:0;font-family:"Rubik",system-ui,-apple-system,sans-serif}
.blk-dot{position:fixed;top:var(--blk-y,60vh);width:58px;height:58px;margin-top:-29px;border:0;padding:0;background:transparent;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;transition:right .32s cubic-bezier(.2,1.2,.4,1),left .32s cubic-bezier(.2,1.2,.4,1)}
.blk[data-side="right"] .blk-dot{right:calc(-18px + env(safe-area-inset-right,0px))}

.blk.open[data-side="left"] .blk-dot,.blk.tp[data-side="left"] .blk-dot,.blk[data-side="left"] .blk-dot:focus-visible{left:calc(8px + env(safe-area-inset-left,0px))}

.blk-m{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 0 rgba(52,78,150,.28));transition:transform .3s cubic-bezier(.2,1.2,.4,1)}
.blk[data-side="right"]:not(.open):not(.drag):not(.tp) .blk-m{transform:rotate(-14deg)}
.blk[data-side="left"]:not(.open):not(.drag):not(.tp) .blk-m{transform:rotate(14deg) scaleX(-1)}

.blk-bob{animation:blkbob 3.2s ease-in-out infinite;transform-origin:30px 56px}
.blk.hop .blk-bob{animation:blkhop .5s cubic-bezier(.3,1.6,.5,1)}
.blk-eyes{transform-origin:30px 33px;animation:blkblink 4.6s infinite}
.blk-open,.blk-o{display:none}
.blk.open .blk-smile,.blk.tp .blk-smile,.blk.drag .blk-smile{display:none}
.blk.open .blk-open,.blk.tp .blk-open{display:inline}

/* portal teleport */
.blk-portal{position:absolute;left:50%;bottom:-4px;width:74px;height:24px;margin-left:-37px;border-radius:50%;background:radial-gradient(ellipse at center,#fff 0,#a99bf0 28%,#4b8ae8 58%,rgba(75,138,232,0) 72%);opacity:0;transform:scale(0);pointer-events:none}
.blk.tp .blk-portal{animation:blkportal .9s ease-out forwards}
.blk.tp .blk-m{animation:blkgo .6s .25s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes blkportal{0%{opacity:0;transform:scale(0) rotate(0)}25%{opacity:1;transform:scale(1) rotate(90deg)}80%{opacity:1;transform:scale(1) rotate(300deg)}100%{opacity:0;transform:scale(.4) rotate(360deg)}}
@keyframes blkgo{0%{transform:none;opacity:1}100%{transform:translateY(22px) scale(.05) rotate(540deg);opacity:0}}
/* panel */
.blk-veil{position:fixed;inset:0;background:rgba(20,30,60,.14)}
.blk-veil[hidden],.blk-ring[hidden]{display:none!important}
.blk-ring{position:fixed;top:var(--blk-ry,40vh);padding:26px 12px 10px;border-radius:14px;background:#fff;border:2px solid #5b6d99;box-shadow:0 5px 0 rgba(52,78,150,.22);transform-origin:var(--blk-ox,100%) 50%;animation:blkpop .28s cubic-bezier(.2,1.25,.4,1) both}
.blk[data-side="right"] .blk-ring{right:calc(var(--blk-rx,76px) + env(safe-area-inset-right,0px))}
.blk[data-side="left"] .blk-ring{left:calc(var(--blk-rx,76px) + env(safe-area-inset-left,0px))}
.blk-ttl{position:absolute;top:-11px;left:12px;font:700 11.5px "Rubik",sans-serif;color:#26304b;background:#ffd24f;border:2px solid #b8901c;border-radius:6px;padding:1px 8px;box-shadow:0 2px 0 #b8901c}
.blk-grid{display:grid;grid-template-columns:repeat(3,84px);grid-auto-rows:84px;gap:6px 2px}
.blk-app{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px;text-decoration:none;color:#26304b;border-radius:10px;min-width:0}
.blk-app:active{transform:translateY(2px)}
.blk-app:focus-visible{outline:2px solid #4b8ae8;outline-offset:0}
.blk-logo{position:relative;width:46px;height:34px;margin-top:5px;border-radius:6px;display:grid;place-items:center;color:#fff;font:400 15px "Lilita One","Rubik",sans-serif;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,#1f2a4d)}
.blk-logo::before,.blk-logo::after{content:"";position:absolute;top:-6px;width:10px;height:5px;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 62%,#1f2a4d);border-bottom:0;border-radius:3px 3px 0 0}
.blk-logo::before{left:7px}.blk-logo::after{right:7px}
.blk-logo.yk{color:#26304b}
.blk-t{display:block;width:100%;text-align:center;font-size:11.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.blk-s{display:block;width:100%;text-align:center;font-size:10px;font-weight:500;color:#64708e;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-3px}
.blk-app[aria-current="page"] .blk-logo{box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,#1f2a4d),0 0 0 3px #fff,0 0 0 5px #4b8ae8}
.blk-app[aria-current="page"] .blk-s{color:#4b8ae8;font-weight:700}
.blk.blk-off{display:none}
@keyframes blkpop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes blkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blkhop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.06,.95)}100%{transform:translateY(0) scale(1)}}
@keyframes blkblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.blk *{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  var BASE='https://faiqdk07-tech.github.io/', SELF='logic-games';
  var APPS=[
    {k:'progres-harian',l:'Progres',s:'Jadwal harian',t:'PH',c:'#3fb46e',h:'progres-harian/#hari-ini'},
    {k:'latihan-kuantitatif',l:'Kuantitatif',s:'PU · PK · PM',t:'LK',c:'#ef5f5a',h:'latihan-kuantitatif/'},
    {k:'logic-games',l:'Nalar',s:'Logika PU',t:'NH',c:'#8d6be8',h:'logic-games/'},
    {k:'latihan-ppu-pbm',l:'PPU & PBM',s:'Kebahasaan',t:'PB',c:'#4fc0ec',h:'latihan-ppu-pbm/'},
    {k:'vocab-lab',l:'Vocab Lab',s:'Kosakata',t:'VL',c:'#4b8ae8',h:'vocab-lab/'},
    {k:'ruang-baca',l:'Ruang Baca',s:'Literasi',t:'RB',c:'#ff9d4d',yk:1,h:'ruang-baca/'}
  ];
  var hf=document.getElementById('blk'), dot=document.getElementById('blkDot'), ring=document.getElementById('blkRing'), veil=document.getElementById('blkVeil'), grid=document.getElementById('blkGrid');
  var here=(location.pathname.split('/').filter(Boolean)[0]||'').toLowerCase();
  grid.innerHTML=APPS.map(function(a){ var cur=SELF===a.k||here===a.k; return '<a role="menuitem" class="blk-app" href="'+BASE+a.h+'"'+(cur?' aria-current="page"':'')+'><span class="blk-logo'+(a.yk?' yk':'')+'" style="--c:'+a.c+'">'+a.t+'</span><span class="blk-t">'+a.l+'</span><span class="blk-s">'+(cur?'Sedang dibuka':a.s)+'</span></a>'; }).join('');
  var KEY='hubfab.pos', pos={side:'right',y:0.62};
  try{ var p=JSON.parse(localStorage.getItem(KEY)||'null'); if(p&&(p.side==='left'||p.side==='right')&&p.y>0&&p.y<1) pos=p; }catch(e){}
  function clampY(px){ return Math.max(80,Math.min(window.innerHeight-140,px)); }
  function place(){ var y=clampY(pos.y*window.innerHeight); hf.dataset.side=pos.side; hf.style.setProperty('--blk-y',y+'px');
    hf.style.setProperty('--blk-ry',Math.max(12,Math.min(window.innerHeight-250,y-110))+'px');
    hf.style.setProperty('--blk-rx',Math.max(0,Math.min(76,window.innerWidth-300))+'px'); hf.style.setProperty('--blk-ox',pos.side==='right'?'100%':'0%'); }
  function hop(){ hf.classList.remove('hop'); void hf.offsetWidth; hf.classList.add('hop'); setTimeout(function(){ hf.classList.remove('hop'); },520); }
  function open(){ if(hf.classList.contains('open')) return; hf.classList.add('open'); hop(); ring.hidden=false; veil.hidden=false; dot.setAttribute('aria-expanded','true'); dot.setAttribute('aria-label','Bloki: tutup teleport'); }
  function close(){ if(!hf.classList.contains('open')) return; hf.classList.remove('open'); ring.hidden=true; veil.hidden=true; dot.setAttribute('aria-expanded','false'); dot.setAttribute('aria-label','Bloki: buka teleport ke app lain'); }
  place(); window.addEventListener('resize',place);
  var sx=0, sy=0, moved=false, pid=null;
  dot.addEventListener('pointerdown',function(e){ pid=e.pointerId; sx=e.clientX; sy=e.clientY; moved=false; try{ dot.setPointerCapture(pid); }catch(_){} });
  dot.addEventListener('pointermove',function(e){ if(pid!==e.pointerId) return; var dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<8) return; if(!moved){ moved=true; close(); hf.classList.add('drag'); }
    dot.style.left=(e.clientX-29)+'px'; dot.style.right='auto'; hf.style.setProperty('--blk-y',clampY(e.clientY)+'px'); });
  function reset(){ hf.classList.remove('drag'); dot.style.left=''; dot.style.right=''; }
  dot.addEventListener('pointerup',function(e){ if(pid!==e.pointerId) return; pid=null;
    if(moved){ reset(); pos={side:e.clientX<window.innerWidth/2?'left':'right',y:clampY(e.clientY)/window.innerHeight}; try{ localStorage.setItem(KEY,JSON.stringify(pos)); }catch(_){} place(); }
    else { hf.classList.contains('open')?close():open(); } });
  dot.addEventListener('pointercancel',function(e){ if(pid===e.pointerId){ pid=null; reset(); place(); } });
  dot.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hf.classList.contains('open')?close():open(); } });
  /* teleport: Bloki masuk portal, lalu pindah. Di dalam bingkai artefak, tautan dibiarkan jalan biasa. */
  grid.addEventListener('click',function(e){ var a=e.target.closest('.blk-app'); if(!a) return; close(); hf.classList.add('tp');
    if(window.self===window.top&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){ e.preventDefault(); setTimeout(function(){ location.href=a.href; },750); }
    else setTimeout(function(){ hf.classList.remove('tp'); },1000); });
  /* sembunyi saat mengerjakan soal supaya tidak menutupi jawaban */
  var HIDE='.sheet:not(.hidden),.opt,.lboard,.bkgrid,.roles,.vboard,.wa,.kcards,.rkgoal,.river,.shelf,.swipe,.bsrow,.intro2,#kal';
  function inSession(){ try{ return !!(document.body.classList.contains('sess')||document.querySelector(HIDE)); }catch(_){ return false; } }
  function check(){ var off=inSession(); if(off&&pid===null) close(); if(pid===null) hf.classList.toggle('blk-off',off); }
  check(); setInterval(check,400); window.addEventListener('hashchange',function(){ setTimeout(check,0); });
  document.addEventListener('click',function(){ setTimeout(check,30); },true);
  veil.addEventListener('click',close);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
})();
</script>
